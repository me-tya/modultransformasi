<title>Modul Transformasi Kemenkeu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Satu Kemenkeu shell: sidebar navy gelap, topbar navy, aksen kuning; isi kartu putih padat */
:root{
 --side:#101A2C;--side-2:#1A2740;--side-ink:#C9D4E6;--side-mute:#7C8BA5;
 --top:#0D2847;--navy:#0B2447;--navy-2:#163A6B;--blue:#1565C0;--blue-l:#E8F1FC;
 --yellow:#FDB913;--gold:#C8A84B;--gold-l:#F7F0DC;
 --bg:#F2F4F8;--surface:#FFFFFF;--ink:#152033;--ink-2:#34405A;--ink-3:#5F6B85;--ink-4:#9BA5BC;
 --line:#E2E6EF;--line-2:#EEF1F6;
 --ok:#13875F;--ok-bg:#E3F4ED;--info:#1F66C9;--info-bg:#E6EFFC;--warn:#A86D0B;--warn-bg:#FCF1DC;--bad:#BF3434;--bad-bg:#FBE8E8;
 --pur:#6A4FC4;--pur-bg:#EEEAFB;--teal:#16807F;--teal-bg:#DFF2F1;
 --q-crit:#B8860B;--q-champ:#A00000;--q-skep:#111111;--q-adv:#46546B;
 --f:'Nunito Sans','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
 color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-y:scroll;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
a{color:var(--blue)}
.mono{font-family:var(--mono)}
/* ---------- splash ---------- */
.splash{position:fixed;inset:0;background:var(--side);display:grid;place-items:center;z-index:300}
.splash .glyph{width:64px;height:76px;border-width:5px;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
/* ---------- glyph ---------- */
.glyph{width:22px;height:26px;border:2.5px solid #fff;border-radius:3px 7px 7px 3px;position:relative;flex:none}
.glyph:after{content:"";position:absolute;left:4px;top:4px;width:6px;height:12px;border:2px solid var(--yellow);border-left:none;border-bottom:none}
.splash .glyph:after{left:10px;top:10px;width:16px;height:30px;border-width:4px}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;color:#fff;letter-spacing:-.2px}
.brand b{font-weight:800}.brand span{font-weight:400}
/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);background:linear-gradient(120deg,#0A3D7A,#1767C2 55%,#4AA0E8)}
.lg-art{position:relative;overflow:hidden;color:#fff;padding-block:40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;display:flex;flex-direction:column;gap:18px}
.lg-art .arcs{position:absolute;right:-60px;bottom:-140px;width:520px;height:520px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.0) 0 22px,rgba(255,255,255,.55) 22px 30px);opacity:.55;-webkit-mask:linear-gradient(90deg,transparent 0 50%,#000 50%);mask:linear-gradient(90deg,transparent 0 50%,#000 50%)}
.lg-art .sun{position:absolute;right:230px;bottom:150px;width:96px;height:96px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 10px rgba(253,185,19,.18)}
.lg-art h1{font-size:34px;line-height:1.12;margin:auto 0 0;max-width:15ch;font-weight:800;text-wrap:balance;position:relative}
.lg-art p{max-width:46ch;margin:0;color:#DCEBFF;font-size:14px;position:relative}
.lg-flow{display:flex;flex-wrap:wrap;gap:6px;max-width:560px;position:relative}
.lg-flow span{border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 11px;font-size:12px}
.lg-flow span.y{background:var(--yellow);color:var(--navy);border-color:var(--yellow);font-weight:800}
.lg-side{display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.lg-card{width:100%;max-width:420px;background:rgba(246,248,252,.96);border-radius:18px;padding:26px 26px 20px;box-shadow:0 30px 60px rgba(5,25,60,.35);display:flex;flex-direction:column;gap:12px}
.lg-card h2{margin:0;font-size:20px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:10px}
.lg-card .proto{background:var(--warn-bg);color:#7A5410;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45}
.lg-card label.l{font-size:12px;font-weight:700;color:var(--ink-2)}
.inp{height:42px;border:1px solid #C9D3E3;border-radius:8px;padding:0 12px;background:#EEF3FB;width:100%}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,101,192,.18);background:#fff}
.lg-btn{height:44px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-weight:800;letter-spacing:.6px;cursor:pointer}
.lg-btn:hover{background:#0F57A8}
.err{color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:8px 10px;font-size:12px}
.demo{border-top:1px dashed #C9D3E3;padding-top:10px}
.dgs{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.dg{border:1px solid #D6DEEB;border-radius:9px;background:#fff}
.dg summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;padding:8px 10px;font-size:12.5px}
.dg summary::-webkit-details-marker{display:none}
.dg summary span{color:var(--ink-3);font-size:11.5px}
.dg[open] summary{border-bottom:1px solid var(--line-2)}
.dg button{padding:6px 10px!important;border-radius:0!important}
.demo h4{margin:0 0 4px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3)}
.demo button{display:flex;width:100%;justify-content:space-between;gap:8px;border:none;background:none;padding:5px 4px;border-radius:6px;cursor:pointer;text-align:left;font-size:12px}
.demo button:hover{background:#E4ECF8}.demo em{font-style:normal;color:var(--ink-3);white-space:nowrap}
/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100%}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}
.app.collapsed .side{visibility:hidden}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding-left:env(safe-area-inset-left,0px)}
.side .brand{padding:22px 22px 16px}
.nav{padding:4px 12px 18px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;color:var(--side-ink);text-align:left;padding:9px 12px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none}
.nv:hover{background:rgba(255,255,255,.05)}
.nv .ic{width:18px;text-align:center;opacity:.85;flex:none;font-size:13px}
.nv .ch{margin-left:auto;font-size:11px;opacity:.7;transition:transform .15s}
.nv[aria-expanded="true"] .ch{transform:rotate(90deg)}
.nv.open{background:var(--side-2);color:#fff}
.nv.d1{padding-left:40px;font-weight:600;font-size:12.5px}
.nv.d2{padding-left:54px;font-weight:600;font-size:12.5px}
.nv.d3{padding-left:68px;font-weight:600;font-size:12px}
.nv.on{background:var(--yellow);color:var(--navy);font-weight:800}
.nv .new{background:var(--yellow);color:var(--navy);font-size:9px;font-weight:800;border-radius:10px;padding:1px 6px;margin-left:6px}
.nv.on .new{background:var(--navy);color:var(--yellow)}
.grp{display:flex;flex-direction:column;gap:2px}
.grp[hidden]{display:none}
.side .foot{margin-top:auto;padding:12px 20px;font-size:10.5px;color:var(--side-mute);border-top:1px solid rgba(255,255,255,.06)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;min-height:58px;background:var(--top);color:#fff;display:flex;align-items:center;gap:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap;padding-block:8px}
.hamb{background:none;border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;height:34px;width:38px;cursor:pointer;flex:none}
.crumb{font-size:12.5px;color:#A9BCD8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}.crumb b{color:#fff}
.tsel{display:flex;align-items:center;gap:6px;height:34px;border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:0 8px;font-size:12px;color:#C8D6EA}
.tsel select{background:transparent;border:none;color:var(--yellow);font-weight:800}
.tsel select option{color:var(--ink)}
.dbb{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:20px;background:rgba(19,135,95,.18);border:1px solid rgba(80,200,150,.45);color:#B8F0D6;font-size:11px;font-weight:700;white-space:nowrap}
.role{display:flex;align-items:center;gap:6px;background:rgba(253,185,19,.14);border:1px solid rgba(253,185,19,.5);color:#FFE29A;height:34px;padding:0 12px;border-radius:20px;font-weight:800;font-size:11.5px;white-space:nowrap}
.ibtn{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:none;color:#fff;cursor:pointer;flex:none}
.ibtn i{position:absolute;top:-4px;right:-4px;background:#E5484D;color:#fff;font-style:normal;font-size:9.5px;font-weight:800;border-radius:10px;padding:1px 5px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#F7C948,var(--gold));color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:12px;border:none;cursor:pointer;flex:none}
.view{padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
/* ---------- page parts ---------- */
.vh{display:flex;align-items:center;gap:12px;min-height:64px}
.vh>div:nth-child(2){flex:1;min-width:0}
.vh .pic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:14px}
.pic.pmo{background:linear-gradient(135deg,#1565C0,var(--navy))}.pic.cmo{background:linear-gradient(135deg,var(--gold),#7F651B)}.pic.adm{background:linear-gradient(135deg,var(--ink-3),var(--ink))}.pic.dash{background:linear-gradient(135deg,var(--teal),var(--navy))}
.vh h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
.vh p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:nowrap;flex:none}
.vh .acts .btn{height:36px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.card>.ch{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.ch h3{font-size:14px;margin:0;font-weight:800}
.ch .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.s{color:var(--ink-3);font-size:12px}
.pad{padding:12px 14px}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-4)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.dng{color:var(--bad);border-color:#F0C4C4}
.btn.sm{height:26px;padding:0 9px;font-size:11px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ptabs{display:flex;background:linear-gradient(180deg,#FFFFFF,#F6F8FC);border:1px solid #DCE3EF;border-radius:14px;padding:6px;gap:4px;overflow-x:auto;overflow-y:hidden;box-shadow:0 1px 0 #fff inset,0 4px 14px rgba(11,31,69,.06)}
.ptabs a:hover:not(.on){background:#EEF3FB;color:var(--navy)}
.ptabs a+a:before{content:"";position:absolute;left:-3px;top:12px;bottom:12px;width:1px;background:#E3E8F1}
.ptabs a.on:before,.ptabs a.on+a:before{display:none}
.ptabs a{flex:1 0 auto;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;font-weight:700;font-size:12px;color:var(--ink-3);text-decoration:none;white-space:nowrap;position:relative}
.ptabs a b{font-size:10px;font-family:var(--mono);background:var(--line-2);color:var(--ink-3);border-radius:10px;padding:0 6px}
.ptabs a.on{background:linear-gradient(135deg,#0B1F45,#17457F);color:#fff;box-shadow:0 6px 14px rgba(11,31,69,.22)}
.ptabs a.on:after{content:"";position:absolute;left:22%;right:22%;bottom:5px;height:2.5px;border-radius:2px;background:var(--yellow)}
.ptabs a.on b{background:var(--yellow);color:var(--navy)}
.ptabs a{transition:background .15s,color .15s}
.ptabs a em{font-style:normal;font-size:10px;width:17px;height:17px;border-radius:50%;background:var(--navy);color:#fff;display:inline-grid;place-items:center}
.ptabs a.on em{background:var(--yellow);color:#0B1F45}
.subt{display:flex;gap:4px;padding:5px;margin:8px;background:#EEF2F8;border:1px solid #E1E7F0;border-radius:11px;overflow-x:auto;overflow-y:hidden;width:max-content;max-width:calc(100% - 16px)}
.subt a{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;font-weight:700;font-size:12px;color:var(--ink-3);border-radius:8px;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
.subt a:before{content:"";width:6px;height:6px;border-radius:50%;background:#C3CCDB}
.subt a:hover:not(.on){color:var(--navy);background:rgba(255,255,255,.6)}
.subt a.on{color:var(--navy);background:#fff;box-shadow:0 1px 2px rgba(11,31,69,.08),0 3px 10px rgba(11,31,69,.08)}
.subt a.on:before{background:var(--yellow);box-shadow:0 0 0 3px rgba(253,185,19,.22)}
.flt{background:linear-gradient(115deg,#0D2A50,#17457F 70%,#1D5596);border-radius:14px;color:#fff;box-shadow:0 6px 18px rgba(13,40,71,.14);border:1px solid #E9C25A;overflow:hidden}
.fhd{display:flex;align-items:stretch;min-height:46px;cursor:pointer;user-select:none;background:#FFF8E6}
.fhd:focus-visible{outline:2px solid var(--yellow);outline-offset:-2px}
.fhd .fl{display:flex;align-items:center;gap:9px;padding:0 18px;background:#0B1F45;color:#fff;font-weight:800;font-size:13.5px;flex:0 0 auto;min-width:190px}
.fhd .fl svg{flex:0 0 auto}
.fhd .fn{background:#fff;color:#0B1F45;border-radius:20px;font-size:11px;font-weight:800;padding:1px 9px;min-width:26px;text-align:center}
.fhd .fr{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:7px 10px 7px 14px;flex-wrap:wrap}
.fhd .fchips span{background:#fff;border:1px solid #EAD9A6;color:#3D3418}
.fhd .freset{color:#8A6A10}
.fhd .fcar{margin-left:auto;width:30px;height:30px;border-radius:50%;background:#C8A84B;color:#0B1F45;display:grid;place-items:center;font-size:11px;flex:0 0 auto;transition:transform .2s}
.flt.open .fhd .fcar{transform:rotate(180deg)}
.fhd:hover{background:#FFF2CF}
@media(max-width:600px){.fhd .fl{min-width:0;padding:0 12px}}
.fh{display:flex;align-items:center;gap:10px;padding:9px 12px;flex-wrap:wrap}
.ftog{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:9px;border:1px solid rgba(253,185,19,.65);background:rgba(253,185,19,.14);color:var(--yellow);font-weight:800;font-size:12.5px;cursor:pointer}
.ftog .ch2{color:#FFE7A3;font-weight:400;font-size:11px}
.fchips{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.fchips span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);color:#E2ECFA;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:400;white-space:nowrap}
.freset{background:none;border:none;color:#9FC3F2;font-weight:700;font-size:12px;cursor:pointer;text-decoration:underline}
.flt .fbar{border-top:1px solid #E9C25A}
.flt .fbar[hidden]{display:none}
.flt .fbar label{color:var(--yellow)}
.flt .sel{background:#E8F0FB;border-color:#E8F0FB;color:var(--navy);font-weight:400;font-size:12px;height:30px}
.flt .sel option{font-weight:400}
.flt .sel.act{background:#FFF1C2;border-color:var(--yellow);color:#5A4300}
.flt .sel:disabled{background:#2E527F;border-color:#2E527F;color:#CFE0F5;opacity:1}
.flt .seg{border-color:#E8F0FB}.flt .seg button{background:#E8F0FB;color:var(--navy);border-color:#C9D8EE;font-weight:400;font-size:12px;height:28px}.flt .seg button.on{background:var(--yellow);color:var(--navy)}
.flt .sep{background:rgba(255,255,255,.22)}
.cb{position:relative}.cb input{padding-right:30px!important}
.cbc{position:absolute;right:10px;top:8px;color:var(--ink-3);cursor:pointer;font-size:12px;user-select:none}
.cbl{position:relative;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 30px rgba(8,20,40,.2);max-height:280px;overflow:auto;z-index:20}
.cbo{padding:7px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.cbo.hi,.cbo[data-v]:hover{background:var(--blue-l)}.cbo.none{color:var(--ink-3);cursor:default}
.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px}
.fbar .fg{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%}
.fbar label{font-size:11px;font-weight:800;color:var(--ink-3);text-transform:uppercase;letter-spacing:.4px}
.fbar .sep{width:1px;height:24px;background:var(--line)}
.sel{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface);max-width:100%;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:var(--surface);padding:0 10px;height:30px;font-size:11.5px;font-weight:700;color:var(--ink-3);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--navy);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-weight:800;font-size:10.5px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-info{background:var(--info-bg);color:var(--info)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-gray{background:var(--line-2);color:var(--ink-3)}.c-gold{background:var(--gold-l);color:#7F651B}.c-pur{background:var(--pur-bg);color:var(--pur)}.c-teal{background:var(--teal-bg);color:var(--teal)}
.code{font-family:var(--mono);font-weight:700;font-size:10.5px;color:var(--navy-2);background:#EDF2FA;border:1px solid #D8E1F0;padding:1px 6px;border-radius:5px;white-space:nowrap;text-decoration:none}
a.code:hover{border-color:var(--blue)}
.note{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:10px;font-size:12px;line-height:1.5}
.note.i{background:var(--info-bg);color:#1B4C93}.note.w{background:var(--warn-bg);color:#73500F}.note.g{background:var(--gold-l);color:#5F4A14}.note.b{background:var(--bad-bg);color:#8E2626}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0}
.kpi .l{color:var(--ink-3);font-size:11.5px;font-weight:700}
.kpi .v{font-size:23px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}

function xlsxSave(rows,name,sheet){if(!window.XLSX){toast('Pustaka Excel belum termuat. Periksa koneksi internet.');return}try{const wb=XLSX.utils.book_new();(Array.isArray(rows[0])&&rows.length&&rows[0].sheet?rows:[{sheet:sheet||'Data',rows}]).forEach(s=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(s.rows),s.sheet.slice(0,31)));XLSX.writeFile(wb,name);toast('Ekspor dijalankan. Jika unduhan tidak muncul (mode pratinjau), buka berkas HTML langsung di peramban.');log('Ekspor',name)}catch(e){toast('Ekspor gagal: '+e.message)}}
function exportT(id){const o=T[id];if(o.exp)return o.exp(tRows(id));const rows=tRows(id);const cols=o.cols.filter(c=>c.t!=='sec'&&c.k&&c.xp!==false);
 xlsxSave(rows.map(r=>Object.fromEntries(cols.map(c=>[c.l.replace(/<[^>]+>/g,''),c.x?c.x(r):(Array.isArray(r[c.k])?r[c.k].join(', '):r[c.k]??'')]))),`Transformasi_${id}_${TODAY}.xlsx`)}
function importT(id,file){const o=T[id];if(o.imp2)return o.imp2(file);if(!window.XLSX){toast('Pustaka Excel belum termuat.');return}const rd=new FileReader();rd.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const js=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  const cols=o.cols.filter(c=>c.k&&c.t!=='sec');let n=0;js.forEach(r=>{const nr={id:uid()};cols.forEach(c=>{const lab=c.l.replace(/<[^>]+>/g,'');if(lab in r)nr[c.k]=c.t==='chk'?/ya|true|1/i.test(String(r[lab])):r[lab]});if(Object.keys(nr).length>1){o.onAdd?o.onAdd(nr):o.list().push(nr);n++}});
  log('Impor '+(o.ent||id),n+' baris');save();toast(n+' baris diimpor (kolom dicocokkan dengan judul kolom hasil ekspor).');render()}catch(err){toast('Berkas tidak terbaca. Gunakan template hasil ekspor.')}};rd.readAsArrayBuffer(file)}

// Isi konfigurasi di sini sebelum di-hosting agar semua pengguna langsung tersambung, contoh:
// const FIREBASE_CONFIG={apiKey:'…',authDomain:'proyek.firebaseapp.com',projectId:'proyek',storageBucket:'proyek.appspot.com',messagingSenderId:'…',appId:'…'};
const FIREBASE_CONFIG=null;
const RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    function signedIn() { return request.auth != null && request.auth.token.email.matches('.*@kemenkeu[.]go[.]id$'); }\n    function myRef() { return /databases/$(db)/documents/users/$(request.auth.token.email); }\n    function me() { return get(myRef()).data; }\n    function aktif() { return signedIn() && exists(myRef()) && me().aktif == true; }\n    function role(rs) { return aktif() && me().role in rs; }\n    function kosong() { return !exists(/databases/$(db)/documents/config/akses); }\n\n    // Pengguna: dibaca semua akun aktif; dikelola Superadmin.\n    // Pengecualian: saat database masih kosong, akun pertama boleh mendaftarkan dirinya sebagai Superadmin.\n    match /users/{email} {\n      allow read: if signedIn();\n      allow create: if role(['SA']) || (signedIn() && kosong() && email == request.auth.token.email && request.resource.data.role == 'SA');\n      allow update, delete: if role(['SA']);\n    }\n    match /config/{id} {\n      allow read: if signedIn();\n      allow write: if role(['SA']);\n    }\n    // Data PMO\n    match /{col}/{id} {\n      allow read: if aktif() && col in ['programs','tahap','wbs','bukti','ms','kwide','risks','crs','usul','sub','ind','sh','impl','jj','jjMod','pantau','adopsi','tr','reviu','modMeta','log'];\n      allow write: if col in ['programs','tahap','wbs','bukti','ms','kwide','risks','crs'] && role(['SA','PMOK','CMOK','PMOU']);\n      allow write: if col == 'usul' && role(['SA','PMOK','CMOK','PMOU','CMOU']);\n      allow write: if col in ['sub','ind','sh','impl','jj','jjMod','pantau','adopsi','tr','reviu','modMeta'] && role(['SA','PMOK','CMOK','CMOU','TIM']);\n      allow create: if col == 'log' && aktif();\n      allow update, delete: if col == 'log' && role(['SA']);\n    }\n  }\n}\n";
const FS_ARR=['users','programs','tahap','wbs','kwide','risks','crs','usul','sub','ind','sh','jj','pantau','adopsi','tr','reviu','log'];
const FS_MAP=['bukti','ms','impl','jjMod','modMeta'];
const FB={on:false,ready:false,cfg:null,db:null,auth:null,last:{},timer:null,st:'',err:'',unsub:[],rt:null};
function fbCfg(){if(FIREBASE_CONFIG)return FIREBASE_CONFIG;try{const r=localStorage.getItem('mt_fb_cfg');return r?JSON.parse(r):null}catch(e){return null}}

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Pustaka Firebase tidak dapat dimuat ('+src+').'));document.head.appendChild(s)})}
async function fbInit(){const cfg=fbCfg();if(!cfg)return false;const V='10.12.2';
 if(!window.firebase){for(const m of ['app','auth','firestore']){try{await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${V}/firebase-${m}-compat.js`)}catch(e){await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-${m}-compat.js`)}}}
 const app=firebase.apps.find(a=>a.name==='[DEFAULT]')||firebase.initializeApp(cfg);FB.db=app.firestore();FB.auth=app.auth();FB.cfg=cfg;FB.on=true;return true}
function demoUsers(){try{const c=JSON.parse(localStorage.getItem(KEY+'_demo')||'null');if(c&&c.length)return c}catch(e){}try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.users)return r.users}catch(e){}return seed().users}
function fbErr(e){const c=(e&&e.code)||'';if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return 'Email atau kata sandi salah.';if(/too-many-requests/.test(c))return 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';if(/permission-denied/.test(c))return 'Ditolak Security Rules Firestore. Periksa peran akun dan rules.';if(/network|unavailable/.test(c))return 'Tidak dapat menghubungi Firebase. Periksa koneksi.';if(/weak-password/.test(c))return 'Kata sandi minimal 6 karakter.';if(/requires-recent-login/.test(c))return 'Keluar lalu masuk lagi sebelum mengubah kata sandi.';return (e&&e.message)||String(e)}
function fsBlank(){let ui;try{ui=JSON.parse(localStorage.getItem(KEY+'_ui')||'null')}catch(e){}const b={v:6,av:2,cfg:{rep:9,pdmp:true},ui:ui||seed().ui,akses:{},log:[]};FS_ARR.forEach(c=>b[c]=b[c]||[]);FS_MAP.forEach(c=>b[c]={});return b}
const fsId=(c,x)=>c==='users'?String(x.email).toLowerCase():String(x.id);
function fsDocs(){const out={};FS_ARR.forEach(c=>{out[c]={};const arr=S[c]||[];let mx=arr.reduce((m,x)=>Math.max(m,x._o||0),0);
  (c==='log'?arr.slice().reverse():arr).forEach(x=>{if(c==='log'&&!x.id)x.id=uid();if(x._o==null)x._o=++mx;let d=x;if(c==='users'){d=Object.assign({},x);delete d.pw}out[c][fsId(c,x)]=d})});
 FS_MAP.forEach(c=>{out[c]={};Object.entries(S[c]||{}).forEach(([k,v])=>{if(v&&typeof v==='object')out[c][k]=v})});out.config={akses:{v:S.akses},cfg:{v:S.cfg}};return out}
function fsSchedule(){if(!FB.on||!FB.ready)return;clearTimeout(FB.timer);FB.st='Menyimpan…';setDbBadge();FB.timer=setTimeout(fsFlush,500)}
async function fsFlush(){const cur=fsDocs(),ops=[],next={};
 for(const c in cur){const prev=FB.last[c]||{};next[c]={};for(const id in cur[c]){const js=stab(cur[c][id]);next[c][id]=js;if(prev[id]!==js)ops.push(['set',c,id,JSON.parse(js)])}if(c!=='log')for(const id in prev)if(!(id in next[c]))ops.push(['del',c,id])}
 if(!ops.length){FB.st='Tersimpan';setDbBadge();return}
 try{for(let i=0;i<ops.length;i+=400){const b=FB.db.batch();ops.slice(i,i+400).forEach(([k,c,id,d])=>{const r=FB.db.collection(c).doc(id);k==='set'?b.set(r,d):b.delete(r)});await b.commit()}
  for(const c in next){FB.last[c]=Object.assign({},c==='log'?FB.last[c]:{},next[c])}FB.st='Tersimpan ke Firestore';FB.err=''}
 catch(e){FB.st='Gagal menyimpan';FB.err=fbErr(e);toast('Gagal menyimpan ke Firestore: '+FB.err)}setDbBadge()}
function applyCol(c,docs){FB.last[c]=FB.last[c]||{};let changed=false;
 if(c==='config'){if(docs.akses&&stab(docs.akses)!==FB.last.config.akses){S.akses=docs.akses.v;changed=true}if(docs.cfg&&stab(docs.cfg)!==FB.last.config.cfg){S.cfg=docs.cfg.v;changed=true}}
 else if(FS_MAP.includes(c)){const tgt=S[c];Object.entries(docs).forEach(([k,d])=>{if(stab(d)===FB.last[c][k])return;changed=true;if(tgt[k]){Object.keys(tgt[k]).forEach(x=>delete tgt[k][x]);Object.assign(tgt[k],d)}else tgt[k]=d});Object.keys(tgt).forEach(k=>{if(!(k in docs)){delete tgt[k];changed=true}})}
 else{const arr=S[c],by=new Map(arr.map(x=>[fsId(c,x),x]));const res=[];Object.entries(docs).forEach(([id,d])=>{const o=by.get(id);if(o&&stab(d)===FB.last[c][id]){res.push(o);return}changed=true;if(o){const pw=o.pw;Object.keys(o).forEach(x=>delete o[x]);Object.assign(o,d);if(pw)o.pw=pw;res.push(o)}else res.push(d)});
  if(res.length!==arr.length)changed=true;res.sort((a,b)=>c==='log'?(b._o||0)-(a._o||0):(a._o||0)-(b._o||0));arr.length=0;res.forEach(x=>arr.push(x))}
 if(c==='users')try{localStorage.setItem(KEY+'_demo',JSON.stringify(S.users.map(u=>({email:u.email,nama:u.nama,role:u.role,unit:u.unit,sub:u.sub,aktif:u.aktif}))))}catch(e){}
 const last={};Object.entries(docs).forEach(([id,d])=>last[id]=stab(d));FB.last[c]=c==='log'?Object.assign(FB.last[c],last):last;
 if(changed){MODC=null;WIDX=null;if(c==='users'&&ME)ME=S.users.find(u=>u.email.toLowerCase()===ME.email.toLowerCase())||ME}return changed}
function fsListen(){FB.unsub.forEach(u=>u());FB.unsub=[];const cols=[...FS_ARR,...FS_MAP,'config'];let pending=cols.length;
 return new Promise(res=>{cols.forEach(c=>{let first=true;const q=c==='log'?FB.db.collection('log').orderBy('_o','desc').limit(400):FB.db.collection(c);
  FB.unsub.push(q.onSnapshot(snap=>{const docs={};snap.forEach(d=>docs[d.id]=d.data());const ch=applyCol(c,docs);if(first){first=false;if(--pending===0)res()}else if(ch&&!snap.metadata.hasPendingWrites)remoteRender()},
   err=>{FB.err=fbErr(err);setDbBadge();if(first){first=false;if(--pending===0)res()}}))})})}
function remoteRender(){clearTimeout(FB.rt);FB.rt=setTimeout(()=>{const a=document.activeElement;if(document.querySelector('.ov,.menu')||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){remoteRender();return}if(ME)render()},400)}
function setDbBadge(){const b=document.getElementById('dbb');if(b)b.textContent=(FB.err&&FB.st==='Gagal menyimpan'?'⚠ ':'● ')+(FB.st||'Firestore')}
async function fbAfterAuth(){const email=FB.auth.currentUser.email.toLowerCase();if(!/@kemenkeu\.go\.id$/.test(email)){await FB.auth.signOut();throw new Error('Gunakan email @kemenkeu.go.id.')}
 let ud=null;try{ud=await FB.db.collection('users').doc(email).get()}catch(e){}
 if(!ud||!ud.exists){let c=null;try{c=await FB.db.collection('config').doc('akses').get()}catch(e){}if(c&&!c.exists)return 'bootstrap';await FB.auth.signOut();throw new Error('Akun ini belum terdaftar di Modul Transformasi. Hubungi Superadmin.')}
 if(ud.data().aktif===false){await FB.auth.signOut();throw new Error('Akun nonaktif. Hubungi Superadmin.')}
 await fsListen();FB.ready=true;FB.st='Tersambung';ME=S.users.find(u=>u.email.toLowerCase()===email)||null;if(!ME)throw new Error('Data pengguna tidak terbaca dari Firestore.');return 'ok'}
function bootstrapUI(email){let local=false;try{const r=JSON.parse(localStorage.getItem(KEY)||'null');local=!!(r&&r.v===6)}catch(e){}
 modal('Isi database Firestore',`<p style="margin:0 0 8px">Database Firestore project <b>${esc(FB.cfg.projectId)}</b> masih kosong.</p><p style="margin:0 0 8px">Data yang akan diunggah: <b>${local?'data di peramban ini (termasuk perubahan Anda)':'data awal (WBS Kompilasi 930 item + kertas kerja CM)'}</b>. Akun <b>${esc(email)}</b> menjadi Superadmin.</p><p class="s" style="margin:0">Sekitar 1.200 dokumen, satu kali saja.</p>`,'Isi database',()=>{doBootstrap(email)},{cancel:'Batal',size:'sm'})}
async function doBootstrap(email){const sp=splashOn('Mengisi database Firestore…');try{let base=null;try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r&&r.v===6)base=r}catch(e){}
 const ui=S.ui;S=base||seed();if(!base){numberIds();addTimUsers();unionK();S.av=2}S.ui=ui;
 let me=S.users.find(u=>u.email.toLowerCase()===email);if(!me){me={id:uid(),email,nama:email.split('@')[0],role:'SA',unit:'BaTii',sub:'',modules:[],aktif:true};S.users.unshift(me)}else{me.role='SA';me.aktif=true}
 const d=Object.assign({},me);delete d.pw;await FB.db.collection('users').doc(email).set(JSON.parse(JSON.stringify(d)));
 FB.last={};ME=me;log('Inisialisasi Firestore','Data awal diunggah ke project '+FB.cfg.projectId);await fsFlush();if(FB.st==='Gagal menyimpan')throw new Error(FB.err);
 await fsListen();FB.ready=true;ME=S.users.find(u=>u.email.toLowerCase()===email);sp.remove();toast('Database terisi. Buat akun login pengguna lain di Pengaturan › Database.');if(!location.hash)location.hash='beranda';readHash();render()}
 catch(e){sp.remove();renderLogin('Gagal mengisi database: '+fbErr(e))}}
async function fbCreateAuth(email,pw){const a=firebase.apps.find(x=>x.name==='sec')||firebase.initializeApp(FB.cfg,'sec');try{await a.auth().createUserWithEmailAndPassword(email,pw);await a.auth().signOut();return 'baru'}catch(e){if(e.code==='auth/email-already-in-use')return 'ada';throw e}}
function splashOn(txt){const d=document.createElement('div');d.className='splash';d.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;gap:18px"><span class="glyph" aria-hidden="true"></span><span style="color:#C9D4E6;font-size:13px">${esc(txt||'')}</span></div>`;document.body.appendChild(d);return d}
function parseCfg(t){const m=String(t).match(/\{[\s\S]*\}/);if(!m)throw new Error('Objek { … } tidak ditemukan.');const j=m[0].replace(/\/\/.*$/gm,'').replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,'}');const o=JSON.parse(j);if(!o.apiKey||!o.projectId)throw new Error('apiKey dan projectId wajib ada.');return o}
function viewDb(){const cfg=fbCfg();const on=FB.on&&FB.ready;
 return vh('DB','adm','Database','Penyimpanan data: lokal di peramban atau Firebase Firestore.')+
 `<div class="g2"><div class="card"><div class="ch"><h3>Status koneksi</h3></div><div class="pad"><div class="kv"><span>Mode</span><div>${on?`<span class="chip c-ok">Firestore</span> project <b>${esc(FB.cfg.projectId)}</b>`:cfg?'<span class="chip c-warn">Firestore dikonfigurasi, belum tersambung</span>':'<span class="chip c-gray">Lokal</span> data hanya di peramban ini'}</div><span>Sinkron</span><div>${esc(FB.st||'—')}</div>${FB.err?`<span>Galat terakhir</span><div style="color:var(--bad)">${esc(FB.err)}</div>`:''}<span>Isi data</span><div>${rp(S.wbs.length)} item WBS · ${S.users.length} pengguna · ${S.sh.length} stakeholder · ${S.log.length} log</div></div>
 ${on&&ME.role==='SA'?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn pri" data-act="fbaccts">Buat akun login semua pengguna</button></div><p class="s" style="margin:8px 0 0">Akun dibuat di Firebase Authentication dengan kata sandi awal <span class="mono">${PW}</span>; minta pengguna menggantinya lewat menu akun.</p>`:''}</div></div>
 <div class="card"><div class="ch"><h3>Konfigurasi Firebase</h3></div><div class="pad"><div class="fld"><label for="fbc">Objek firebaseConfig dari Firebase Console</label><textarea id="fbc" rows="8" placeholder="{ apiKey: '…', authDomain: '…', projectId: '…', storageBucket: '…', messagingSenderId: '…', appId: '…' }" ${FIREBASE_CONFIG?'disabled':''}>${cfg?esc(JSON.stringify(cfg,null,2)):''}</textarea><small>${FIREBASE_CONFIG?'Terkunci: konfigurasi ditanam di berkas HTML (FIREBASE_CONFIG).':'Disimpan di peramban ini saja. Untuk semua pengguna, isi konstanta FIREBASE_CONFIG di berkas HTML sebelum di-hosting.'}</small></div>
 <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">${FIREBASE_CONFIG?'':'<button class="btn pri" data-act="fbsave">Simpan & sambungkan</button>'}${cfg&&!FIREBASE_CONFIG?'<button class="btn dng" data-act="fboff">Putuskan, kembali ke mode lokal</button>':''}</div>
 <div class="note w" style="margin-top:10px"><span>Di tampilan artifact Claude koneksi ke Firebase diblokir. Uji mode Firestore setelah berkas HTML di-hosting (Firebase Hosting, GitHub Pages, atau Cloudflare Pages).</span></div></div></div></div>
 <div class="card"><div class="ch"><h3>Security Rules Firestore</h3><span class="r"><button class="btn sm" data-act="cprules">Salin rules</button></span></div><div class="pad"><pre id="rules" style="margin:0;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;background:#F6F8FC;border:1px solid var(--line);border-radius:10px;padding:12px;max-height:380px;overflow:auto">${esc(RULES)}</pre></div></div>`}
ACT.fbsave=()=>{try{const o=parseCfg($('#fbc').value);localStorage.setItem('mt_fb_cfg',JSON.stringify(o));log('Konfigurasi Firebase',o.projectId);toast('Tersimpan. Memuat ulang…');setTimeout(()=>location.reload(),600)}catch(e){toast('Konfigurasi tidak valid: '+e.message)}};
ACT.fboff=()=>modal('Putuskan Firestore?','<p style="margin:0">Peramban ini kembali memakai data lokal. Data di Firestore tidak dihapus.</p>','Putuskan',async()=>{try{if(FB.auth)await FB.auth.signOut()}catch(e){}try{localStorage.removeItem('mt_fb_cfg')}catch(e){}location.reload()},{danger:true,size:'sm'});
ACT.cprules=()=>{const done=()=>toast('Rules disalin.');try{navigator.clipboard.writeText(RULES).then(done,()=>{const r=document.createRange();r.selectNodeContents($('#rules'));getSelection().removeAllRanges();getSelection().addRange(r);toast('Teks rules terpilih; tekan Ctrl+C.')})}catch(e){const r=document.createRange();r.selectNodeContents($('#rules'));getSelection().removeAllRanges();getSelection().addRange(r);toast('Teks rules terpilih; tekan Ctrl+C.')}};
ACT.fbaccts=async el=>{el.disabled=true;let b=0,a=0;const gagal=[];for(const u of S.users){if(!u.aktif)continue;el.textContent=`Membuat akun… ${b+a+gagal.length+1}/${S.users.length}`;try{const r=await fbCreateAuth(u.email.toLowerCase(),PW);r==='baru'?b++:a++}catch(e){gagal.push(u.email+': '+fbErr(e))}}
 log('Buat akun login',`${b} baru, ${a} sudah ada, ${gagal.length} gagal`);save();modal('Akun login',`<p style="margin:0 0 8px">${b} akun baru dibuat, ${a} sudah ada.</p>${gagal.length?`<p style="margin:0;color:var(--bad)">${gagal.map(esc).join('<br>')}</p>`:''}`,null,null,{cancel:'Tutup',size:'sm'});render()};

/* ======================== start ======================== */
(async function start(){if(!fbCfg()){load();const e=sess();if(e){ME=S.users.find(u=>u.email===e&&u.aktif)||null}readHash();render();return}
 S=fsBlank();readHash();const sp=splashOn('Menghubungkan ke Firestore…');
 try{await fbInit();const u=await new Promise(r=>{const un=FB.auth.onAuthStateChanged(x=>{un();r(x)})});if(u){const r=await fbAfterAuth();if(r==='bootstrap'){sp.remove();render();bootstrapUI(u.email.toLowerCase());return}}}catch(e){FB.loginErr=fbErr(e)}
 sp.remove();render()})();
</script>
