<title>Modul Transformasi Kemenkeu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Satu Kemenkeu shell: sidebar navy gelap, topbar navy, aksen kuning; isi kartu putih padat */
:root{
 --side:#101A2C;--side-2:#1A2740;--side-ink:#C9D4E6;--side-mute:#7C8BA5;
 --top:#0D2847;--navy:#0B2447;--navy-2:#163A6B;--blue:#1565C0;--blue-l:#E8F1FC;
 --yellow:#FDB913;--gold:#C8A84B;--gold-l:#F7F0DC;
 --bg:#F2F4F8;--surface:#FFFFFF;--ink:#152033;--ink-2:#34405A;--ink-3:#5F6B85;--ink-4:#9BA5BC;
 --line:#E2E6EF;--line-2:#EEF1F6;
 --ok:#13875F;--ok-bg:#E3F4ED;--info:#1F66C9;--info-bg:#E6EFFC;--warn:#A86D0B;--warn-bg:#FCF1DC;--bad:#BF3434;--bad-bg:#FBE8E8;
 --pur:#6A4FC4;--pur-bg:#EEEAFB;--teal:#16807F;--teal-bg:#DFF2F1;
 --q-crit:#B8860B;--q-champ:#A00000;--q-skep:#111111;--q-adv:#46546B;
 --f:'Nunito Sans','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
 color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
html{overflow-y:scroll;scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
a{color:var(--blue)}
.mono{font-family:var(--mono)}
/* ---------- splash ---------- */
.splash{position:fixed;inset:0;background:var(--side);display:grid;place-items:center;z-index:300}
.splash .glyph{width:64px;height:76px;border-width:5px;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.55;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
/* ---------- glyph ---------- */
.glyph{width:22px;height:26px;border:2.5px solid #fff;border-radius:3px 7px 7px 3px;position:relative;flex:none}
.glyph:after{content:"";position:absolute;left:4px;top:4px;width:6px;height:12px;border:2px solid var(--yellow);border-left:none;border-bottom:none}
.splash .glyph:after{left:10px;top:10px;width:16px;height:30px;border-width:4px}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;color:#fff;letter-spacing:-.2px}
.brand b{font-weight:800}.brand span{font-weight:400}
/* ---------- login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);background:linear-gradient(120deg,#0A3D7A,#1767C2 55%,#4AA0E8)}
.lg-art{position:relative;overflow:hidden;color:#fff;padding-block:40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;display:flex;flex-direction:column;gap:18px}
.lg-art .arcs{position:absolute;right:-60px;bottom:-140px;width:520px;height:520px;border-radius:50%;background:repeating-radial-gradient(circle,rgba(255,255,255,.0) 0 22px,rgba(255,255,255,.55) 22px 30px);opacity:.55;-webkit-mask:linear-gradient(90deg,transparent 0 50%,#000 50%);mask:linear-gradient(90deg,transparent 0 50%,#000 50%)}
.lg-art .sun{position:absolute;right:230px;bottom:150px;width:96px;height:96px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 10px rgba(253,185,19,.18)}
.lg-art h1{font-size:34px;line-height:1.12;margin:auto 0 0;max-width:15ch;font-weight:800;text-wrap:balance;position:relative}
.lg-art p{max-width:46ch;margin:0;color:#DCEBFF;font-size:14px;position:relative}
.lg-flow{display:flex;flex-wrap:wrap;gap:6px;max-width:560px;position:relative}
.lg-flow span{border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 11px;font-size:12px}
.lg-flow span.y{background:var(--yellow);color:var(--navy);border-color:var(--yellow);font-weight:800}
.lg-side{display:flex;align-items:center;justify-content:center;padding-block:32px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.lg-card{width:100%;max-width:420px;background:rgba(246,248,252,.96);border-radius:18px;padding:26px 26px 20px;box-shadow:0 30px 60px rgba(5,25,60,.35);display:flex;flex-direction:column;gap:12px}
.lg-card h2{margin:0;font-size:20px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:10px}
.lg-card .proto{background:var(--warn-bg);color:#7A5410;border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45}
.lg-card label.l{font-size:12px;font-weight:700;color:var(--ink-2)}
.inp{height:42px;border:1px solid #C9D3E3;border-radius:8px;padding:0 12px;background:#EEF3FB;width:100%}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(21,101,192,.18);background:#fff}
.lg-btn{height:44px;border:none;border-radius:8px;background:var(--blue);color:#fff;font-weight:800;letter-spacing:.6px;cursor:pointer}
.lg-btn:hover{background:#0F57A8}
.err{color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:8px 10px;font-size:12px}
.demo{border-top:1px dashed #C9D3E3;padding-top:10px}
.dgs{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.dg{border:1px solid #D6DEEB;border-radius:9px;background:#fff}
.dg summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;padding:8px 10px;font-size:12.5px}
.dg summary::-webkit-details-marker{display:none}
.dg summary span{color:var(--ink-3);font-size:11.5px}
.dg[open] summary{border-bottom:1px solid var(--line-2)}
.dg button{padding:6px 10px!important;border-radius:0!important}
.demo h4{margin:0 0 4px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3)}
.demo button{display:flex;width:100%;justify-content:space-between;gap:8px;border:none;background:none;padding:5px 4px;border-radius:6px;cursor:pointer;text-align:left;font-size:12px}
.demo button:hover{background:#E4ECF8}.demo em{font-style:normal;color:var(--ink-3);white-space:nowrap}
/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100%}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}
.app.collapsed .side{visibility:hidden}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;padding-left:env(safe-area-inset-left,0px)}
.side .brand{padding:22px 22px 16px}
.nav{padding:4px 12px 18px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;color:var(--side-ink);text-align:left;padding:9px 12px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none}
.nv:hover{background:rgba(255,255,255,.05)}
.nv .ic{width:18px;text-align:center;opacity:.85;flex:none;font-size:13px}
.nv .ch{margin-left:auto;font-size:11px;opacity:.7;transition:transform .15s}
.nv[aria-expanded="true"] .ch{transform:rotate(90deg)}
.nv.open{background:var(--side-2);color:#fff}
.nv.d1{padding-left:40px;font-weight:600;font-size:12.5px}
.nv.d2{padding-left:54px;font-weight:600;font-size:12.5px}
.nv.d3{padding-left:68px;font-weight:600;font-size:12px}
.nv.on{background:var(--yellow);color:var(--navy);font-weight:800}
.nv .new{background:var(--yellow);color:var(--navy);font-size:9px;font-weight:800;border-radius:10px;padding:1px 6px;margin-left:6px}
.nv.on .new{background:var(--navy);color:var(--yellow)}
.grp{display:flex;flex-direction:column;gap:2px}
.grp[hidden]{display:none}
.side .foot{margin-top:auto;padding:12px 20px;font-size:10.5px;color:var(--side-mute);border-top:1px solid rgba(255,255,255,.06)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;min-height:58px;background:var(--top);color:#fff;display:flex;align-items:center;gap:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap;padding-block:8px}
.hamb{background:none;border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;height:34px;width:38px;cursor:pointer;flex:none}
.crumb{font-size:12.5px;color:#A9BCD8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}.crumb b{color:#fff}
.tsel{display:flex;align-items:center;gap:6px;height:34px;border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:0 8px;font-size:12px;color:#C8D6EA}
.tsel select{background:transparent;border:none;color:var(--yellow);font-weight:800}
.tsel select option{color:var(--ink)}
.dbb{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:20px;background:rgba(19,135,95,.18);border:1px solid rgba(80,200,150,.45);color:#B8F0D6;font-size:11px;font-weight:700;white-space:nowrap}
.role{display:flex;align-items:center;gap:6px;background:rgba(253,185,19,.14);border:1px solid rgba(253,185,19,.5);color:#FFE29A;height:34px;padding:0 12px;border-radius:20px;font-weight:800;font-size:11.5px;white-space:nowrap}
.ibtn{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:none;color:#fff;cursor:pointer;flex:none}
.ibtn i{position:absolute;top:-4px;right:-4px;background:#E5484D;color:#fff;font-style:normal;font-size:9.5px;font-weight:800;border-radius:10px;padding:1px 5px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#F7C948,var(--gold));color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:12px;border:none;cursor:pointer;flex:none}
.view{padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;min-width:0}
/* ---------- page parts ---------- */
.vh{display:flex;align-items:center;gap:12px;min-height:64px}
.vh>div:nth-child(2){flex:1;min-width:0}
.vh .pic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none;font-size:14px}
.pic.pmo{background:linear-gradient(135deg,#1565C0,var(--navy))}.pic.cmo{background:linear-gradient(135deg,var(--gold),#7F651B)}.pic.adm{background:linear-gradient(135deg,var(--ink-3),var(--ink))}.pic.dash{background:linear-gradient(135deg,var(--teal),var(--navy))}
.vh h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
.vh p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vh .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:nowrap;flex:none}
.vh .acts .btn{height:36px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0}
.card>.ch{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.ch h3{font-size:14px;margin:0;font-weight:800}
.ch .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.s{color:var(--ink-3);font-size:12px}
.pad{padding:12px 14px}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-4)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.dng{color:var(--bad);border-color:#F0C4C4}
.btn.sm{height:26px;padding:0 9px;font-size:11px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ptabs{display:flex;background:linear-gradient(180deg,#FFFFFF,#F6F8FC);border:1px solid #DCE3EF;border-radius:14px;padding:6px;gap:4px;overflow-x:auto;overflow-y:hidden;box-shadow:0 1px 0 #fff inset,0 4px 14px rgba(11,31,69,.06)}
.ptabs a:hover:not(.on){background:#EEF3FB;color:var(--navy)}
.ptabs a+a:before{content:"";position:absolute;left:-3px;top:12px;bottom:12px;width:1px;background:#E3E8F1}
.ptabs a.on:before,.ptabs a.on+a:before{display:none}
.ptabs a{flex:1 0 auto;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;font-weight:700;font-size:12px;color:var(--ink-3);text-decoration:none;white-space:nowrap;position:relative}
.ptabs a b{font-size:10px;font-family:var(--mono);background:var(--line-2);color:var(--ink-3);border-radius:10px;padding:0 6px}
.ptabs a.on{background:linear-gradient(135deg,#0B1F45,#17457F);color:#fff;box-shadow:0 6px 14px rgba(11,31,69,.22)}
.ptabs a.on:after{content:"";position:absolute;left:22%;right:22%;bottom:5px;height:2.5px;border-radius:2px;background:var(--yellow)}
.ptabs a.on b{background:var(--yellow);color:var(--navy)}
.ptabs a{transition:background .15s,color .15s}
.ptabs a em{font-style:normal;font-size:10px;width:17px;height:17px;border-radius:50%;background:var(--navy);color:#fff;display:inline-grid;place-items:center}
.ptabs a.on em{background:var(--yellow);color:#0B1F45}
.subt{display:flex;gap:4px;padding:5px;margin:8px;background:#EEF2F8;border:1px solid #E1E7F0;border-radius:11px;overflow-x:auto;overflow-y:hidden;width:max-content;max-width:calc(100% - 16px)}
.subt a{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;font-weight:700;font-size:12px;color:var(--ink-3);border-radius:8px;text-decoration:none;white-space:nowrap;cursor:pointer;transition:background .15s,color .15s}
.subt a:before{content:"";width:6px;height:6px;border-radius:50%;background:#C3CCDB}
.subt a:hover:not(.on){color:var(--navy);background:rgba(255,255,255,.6)}
.subt a.on{color:var(--navy);background:#fff;box-shadow:0 1px 2px rgba(11,31,69,.08),0 3px 10px rgba(11,31,69,.08)}
.subt a.on:before{background:var(--yellow);box-shadow:0 0 0 3px rgba(253,185,19,.22)}
.flt{background:var(--surface);border:1px solid #CFDDF0;border-radius:16px;box-shadow:0 6px 18px rgba(13,40,71,.08);color:var(--ink)}
.flt.fx2{display:grid;grid-template-columns:230px minmax(0,1fr)}
.flt .lp{background:linear-gradient(160deg,#0B2447,#17457F);color:#fff;padding:16px 18px;display:flex;flex-direction:column;gap:12px;border-radius:15px 0 0 15px;cursor:pointer;user-select:none}
.flt .lt{display:flex;gap:12px;align-items:center;min-width:0}.flt .lt b{display:block;font-size:18px;line-height:1.2}.flt .lt small{display:block;font-size:12px;color:#D7E3F5;margin-top:2px}
.flt .gi{width:44px;height:44px;border-radius:50%;background:rgba(253,185,19,.16);border:1px solid rgba(253,185,19,.45);color:#FDB913;display:grid;place-items:center;flex:none}
.flt .lp hr{border:none;border-top:1px solid rgba(255,255,255,.18);margin:0;width:100%}
.flt .res{text-align:center}.flt .res>span{display:block;font-size:12px;color:#D7E3F5}.flt .res>b{display:block;font-size:34px;line-height:1.1;margin:2px 0}.flt .res>small{font-size:12px;color:#D7E3F5}
.flt .res .mb{display:block;width:auto;height:6px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin:7px 6px 0}.flt .res .mb span{display:block;height:6px;border-radius:4px;background:#FDB913}
.flt .nar{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:8px;flex-wrap:wrap}.flt .lp .nar .freset{align-self:auto;padding:0 9px;font-size:11px;line-height:18px;border-radius:20px;border-color:rgba(255,255,255,.45)}.flt .res .na{display:inline-block;margin-top:0;font-style:normal;font-size:11px;font-weight:800;color:#0B2447;background:#FDB913;border-radius:20px;padding:1px 9px}
.flt .lp .freset{align-self:center;background:transparent;font:inherit;font-size:12px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:5px 12px;cursor:pointer;text-decoration:none}.flt .lp .freset:hover{background:rgba(255,255,255,.12)}
.flt .rp{background:linear-gradient(120deg,#F6FAFF,#E6F0FC);border-radius:0 15px 15px 0;min-width:0;display:flex;flex-direction:column}
.flt .ftop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:50px;padding:8px 14px 8px 18px;cursor:pointer;user-select:none}.flt .ftop:focus-visible{outline:2px solid #1F5FB8;outline-offset:-2px;border-radius:12px}
.flt .ftop .tl{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:#163A6B;text-transform:uppercase;margin-right:2px}
.flt .ftop .c1{display:inline-flex;align-items:center;gap:5px;background:#0B2447;color:#fff;border-radius:20px;padding:3px 4px 3px 11px;font-size:11.5px;font-weight:700}
.flt .ftop .fx{width:18px;height:18px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:12px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}.flt .ftop .fx:hover,.flt .ftop .fx:focus-visible{background:#FDB913;color:#0B2447;outline:none}
.flt .ftop .none{font-size:12.5px;color:#4A6488}
.flt .ftop .rs2{margin-left:auto;font-size:12.5px;color:#4A6488;white-space:nowrap}.flt .ftop .rs2 b{color:#0B2447;font-size:14px}
.flt .fcar{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#FDB913;color:#0B1F45;display:grid;place-items:center;font-size:12px;flex:0 0 auto;transition:transform .2s,background .2s;box-shadow:0 2px 6px rgba(200,168,75,.35)}.flt .rs2+.fcar,.flt .rsm+.fcar{margin-left:8px}.flt .ftop .rsm{background:#fff;border:1px solid #C9D8EE;color:#1F5FB8;font:inherit;font-size:11.5px;font-weight:700;border-radius:20px;padding:3px 10px;cursor:pointer;white-space:nowrap;text-decoration:none}.flt .ftop .rsm:hover{background:#E6F0FC}.flt .ftop .rs2+.rsm{margin-left:4px}.flt .ftop .none+.rsm,.flt .ftop .c1+.rsm{margin-left:auto}.flt .ftop:hover .fcar,.flt .lp:hover~.rp .fcar{background:#FFD24A}
.flt .fcar,.flt.open .fcar{transform:none!important;transition:background .2s}
.fcar-tri{display:block;transform-origin:50% 50%;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.flt.open .fcar-tri{transform:rotate(180deg)}
.fcar-tri.anim{animation:fcarUp .28s cubic-bezier(.4,0,.2,1)}.flt.open .fcar-tri.anim{animation-name:fcarDown}
@keyframes fcarDown{from{transform:rotate(0)}to{transform:rotate(180deg)}}@keyframes fcarUp{from{transform:rotate(180deg)}to{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){.fcar-tri,.fcar-tri.anim{animation:none;transition:none}}
.fcar{font-size:10px;line-height:1;box-shadow:0 2px 8px rgba(253,185,19,.3)}
.pm-program-chevron{font-size:11px!important;line-height:1;transform-origin:center}
.pm-program-head[aria-expanded=false] .pm-program-chevron{transform:rotate(-90deg)}
.flt:not(.open) .lp{flex-direction:row;align-items:center;padding:10px 18px;gap:12px;border-radius:15px 0 0 15px}.flt:not(.open) .gi{width:34px;height:34px}.flt:not(.open) .gi svg{width:17px;height:17px}.flt:not(.open) .lt b{font-size:15px}.flt:not(.open) .ftop{padding:8px 14px 8px 18px}

/* ===== Portofolio: daftar program enterprise, tanpa scroll mendatar ===== */

.ws-table td{font-size:12.5px;vertical-align:middle}
.ws-table tbody tr:last-child td{border-bottom:0}
.ws-table tbody tr:hover td{background:#F8FAFE}
.ws-td-main b{display:block;font-weight:700;color:var(--ink)}
.ws-td-main small,.ws-sub{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.ws-td-wide{min-width:220px}
.ws-td-act{text-align:right;white-space:nowrap}
.ws-td-act .btn+.btn{margin-left:4px}
.ws-ctr{text-align:center}
.ws-nowrap{white-space:nowrap}
.ws-dash{color:var(--ink-4)}
.ws-code{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--navy-2);background:var(--blue-l);border:1px solid #CADCF5;border-radius:6px;padding:3px 8px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.ws-code:hover{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
.ws-score{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:7px;font-family:var(--mono);font-weight:700;font-size:11.5px}
.ws-score.hi{background:var(--bad-bg);color:var(--bad)}.ws-score.md{background:var(--warn-bg);color:var(--warn)}.ws-score.lo{background:var(--ok-bg);color:var(--ok)}
.ws-pi{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.ws-pi i{font-style:normal;display:inline-grid;place-items:center;width:17px;height:17px;border-radius:5px;background:var(--line-2);color:var(--ink-3);font-size:10px;font-weight:800}
.btn.sm.dng{color:var(--bad);border-color:#F0C4C4}.btn.sm.dng:hover{background:var(--bad-bg)}
/* toolbar pencarian */
.ws-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ws-search{display:flex;align-items:center;gap:8px;flex:1 1 320px;max-width:520px;height:38px;padding:0 12px;border:1px solid #C9D8EE;border-radius:10px;background:#fff;color:var(--ink-4);box-shadow:0 1px 2px rgba(11,31,69,.05)}
.ws-search:focus-within{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(21,101,192,.12);color:var(--navy-2)}
.ws-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:12.5px;font-weight:600;color:var(--ink)}
.ws-count{font-size:12px;color:var(--ink-3)}.ws-count b{color:var(--navy);font-family:var(--mono)}
/* pager */
.prj-pager{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-top:12px;margin-top:12px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3)}
.prj-pager small{font-size:12px}
.prj-pager>div{display:flex;gap:8px;align-items:center}
.prj-pager>div>span{font-weight:700;color:var(--ink-2)}
.prj-pager button[disabled]{opacity:.4}
/* empty */
.ws-empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;text-align:center;border:1px dashed #CBD6E6;border-radius:12px;background:#FAFBFE}
.ws-empty-ico{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--blue-l);color:var(--navy-2);margin-bottom:4px}
.ws-empty b{font-size:13px;color:var(--ink-2)}
.ws-empty small{font-size:12px;color:var(--ink-3);max-width:380px;line-height:1.5}
/* milestone timeline */
.ws-timeline{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
.ws-timeline:before{content:"";position:absolute;left:41px;top:10px;bottom:10px;width:2px;background:var(--line)}
.ws-ms{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:16px;align-items:center;padding:10px 0;position:relative}
.ws-ms+.ws-ms{border-top:1px solid var(--line-2)}
.ws-ms-date{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:76px;height:58px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 3px rgba(11,31,69,.06);overflow:hidden}
.ws-ms-date:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:currentColor}
.ws-ms.t-ok,.ws-ms.t-info,.ws-ms.t-gray,.ws-ms.t-bad,.ws-ms.t-warn{background:none}
.ws-ms.t-ok .ws-ms-date{color:var(--ok)}.ws-ms.t-info .ws-ms-date{color:var(--info)}.ws-ms.t-gray .ws-ms-date{color:#9AA6BA}.ws-ms.t-bad .ws-ms-date{color:var(--bad)}.ws-ms.t-warn .ws-ms-date{color:#C98A0E}
.ws-ms-date b{font-size:20px;line-height:1.1;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.ws-ms-date span{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.3px;text-align:center;line-height:1.2}
.ws-ms-body{min-width:0}
.ws-ms-body p{margin:6px 0 2px;font-size:13px;font-weight:700;color:var(--ink);line-height:1.4}
.ws-ms-body small{font-size:11.5px;color:var(--ink-3)}
.ws-ms-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* bukti dukung */
.ws-bk-hero{display:flex;align-items:center;gap:16px;padding:14px 18px;margin-bottom:12px;border-radius:12px;background:linear-gradient(112deg,#F3F7FD 0%,#FFFFFF 60%,#FFF8E3 100%);border:1px solid #DCE6F3}
.ws-bk-shield{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--navy);color:var(--yellow);flex:none;box-shadow:0 6px 14px rgba(11,31,69,.2)}
.ws-bk-hero-txt{flex:1;min-width:0}
.ws-bk-hero-txt>b{font-size:14px;font-weight:800;color:var(--navy)}
.ws-bk-hero-txt small{display:block;font-size:12px;color:var(--ink-3);line-height:1.5}
.ws-bk-hero-txt small b{color:var(--ink-2)}
.ws-bk-pct{font-size:30px;font-weight:800;color:var(--ok);line-height:1;flex:none;font-variant-numeric:tabular-nums}
.ws-bk-pct span{font-size:15px;margin-left:1px}
.ws-bk-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ws-bk-chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 6px 0 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:12px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s}
.ws-bk-chip i{width:8px;height:8px;border-radius:50%}
.ws-bk-chip b{font-family:var(--mono);font-size:10.5px;background:var(--line-2);color:var(--ink-3);border-radius:12px;padding:1px 8px}
.ws-bk-chip:hover{border-color:#B9C8DE;background:#F6F9FD}
.ws-bk-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ws-bk-chip.on b{background:var(--yellow);color:var(--navy)}
.ws-evlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ws-ev{display:grid;grid-template-columns:130px minmax(0,1fr) 100px 140px 352px;gap:14px;align-items:center;padding:12px 14px 12px 17px;border:1px solid var(--line);border-radius:12px;background:#fff;position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.ws-ev:hover{border-color:#C3D2E6;box-shadow:0 4px 14px rgba(11,31,69,.07)}
.ws-ev.t-ok,.ws-ev.t-warn,.ws-ev.t-gold,.ws-ev.t-gray,.ws-ev.t-bad{background:#fff}
.ws-ev:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.ws-ev.t-ok:before{background:var(--ok)}.ws-ev.t-warn:before{background:#E0A021}.ws-ev.t-gold:before{background:var(--gold)}.ws-ev.t-gray:before{background:#C3CCDA}.ws-ev.t-bad:before{background:var(--bad)}
.ws-ev-id{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.ws-ev-date{font-size:11px;color:var(--ink-3);font-weight:600}
.ws-ev-body{min-width:0}
.ws-ev-body p{margin:0 0 3px;font-size:13px;font-weight:700;color:var(--ink);line-height:1.4}
.ws-ev-body small{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ws-ev-ref{display:inline-flex;align-items:center;gap:3px;color:var(--navy-2);font-weight:700}
.ws-ev-st{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.ws-ev-lbl{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-4)}
.ws-ev-act{display:flex;gap:5px;justify-content:flex-end;flex-wrap:nowrap}
.ws-ev-act .btn{gap:5px}
.btn.sm.ws-ghost{background:transparent;border-style:dashed;color:var(--ink-3)}
.btn.sm.ws-ghost:hover{border-color:var(--ink-4);color:var(--ink-2)}
/* footer */
.ws-foot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 20px;background:#fff;border-top:1px solid var(--line)}
.ws-foot span{display:flex;align-items:center;gap:7px;color:var(--ink-3);font-size:12px}
.ws-foot span .ws-i{color:var(--gold)}.ws-foot em{font-style:normal}.ws-foot b{color:var(--ink-2)}
.ws-foot .btn{height:36px;padding:0 20px}
/* help modal */
.prj-example-modal{padding:11px 14px;background:#FFF7DB;border:1px solid #F6DB81;border-radius:9px;color:#4E4B3E;margin-top:12px}
.prj-example-modal p{margin:5px 0 0;line-height:1.6}
/* responsif */
@media(max-width:1180px){.ws-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.ws-ev{grid-template-columns:130px minmax(0,1fr) 110px 150px}.ws-ev-act{grid-column:1/-1;justify-content:flex-start}}
@media(max-width:980px){.ws-grid-2{grid-template-columns:1fr}.ws-tab{padding:0 11px}}
@media(max-width:720px){.prj-overlay{padding:4px}.prj-modal.ws-modal{width:100%;height:99dvh;max-height:99dvh;border-radius:12px}.ws-head{padding:12px 12px 14px;gap:10px}.ws-head-ico{display:none}.ws-head h2{font-size:16px}.ws-crumb{display:none}.ws-tab span{display:none}.ws-tab{flex:1 0 auto;padding:0 12px}.ws-tab.on span{display:inline}.prj-modal-content.ws-body{padding:10px}.ws-scope{grid-template-columns:1fr}.ws-scope>.hlp{display:none}.ws-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.ws-dl{grid-template-columns:1fr}.ws-dl>div:nth-child(odd):not(.ws-dl-wide){border-right:0}.ws-ms{grid-template-columns:64px minmax(0,1fr)}.ws-ms-date{width:64px}.ws-timeline:before{left:35px}.ws-ms-meta{grid-column:2;justify-content:flex-start}.ws-ev{grid-template-columns:1fr;gap:8px}.ws-ev-st{flex-direction:row;align-items:center}.ws-bk-hero{flex-wrap:wrap}.ws-foot span{display:none}}
/* Tombol buka Workspace di tabel Program */
.pm-project-table .pm-ws-action{width:64px!important;text-align:center}
.pm-ws-icon{display:inline-grid;place-items:center;width:36px;height:36px;border:1px solid #C9D8EE;border-radius:10px;background:linear-gradient(180deg,#FFFFFF,#F2F6FC);color:var(--navy-2);cursor:pointer;position:relative;box-shadow:0 1px 2px rgba(11,31,69,.08);transition:background .18s,color .18s,border-color .18s,transform .18s,box-shadow .18s}
.pm-ws-icon:after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--yellow);border:2px solid #fff;opacity:0;transform:scale(.4);transition:opacity .18s,transform .18s}
.pm-ws-icon:hover,.pm-ws-icon:focus-visible{background:linear-gradient(135deg,#0B1F45,#17457F);border-color:#0B1F45;color:var(--yellow);transform:translateY(-1px);box-shadow:0 6px 14px rgba(11,31,69,.22)}
.pm-ws-icon:hover:after,.pm-ws-icon:focus-visible:after{opacity:1;transform:scale(1)}

/* Toolbar Program: satu baris tipis */
.pm-tb1{display:flex;align-items:center;gap:10px;height:48px;padding:0 6px 0 14px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(11,31,69,.04)}
.pm-tb-search{display:flex;align-items:center;gap:8px;flex:1;min-width:0;height:34px;color:var(--ink-4)}
.pm-tb-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--ink)}
.pm-tb-search:focus-within{color:var(--navy-2)}
.pm-tb-count{font-size:12px;color:var(--ink-3);white-space:nowrap}.pm-tb-count b{color:var(--navy);font-weight:800}
.pm-tb-sep{width:1px;height:24px;background:var(--line);flex:none}
.pm-tb-sw{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 8px;border-radius:9px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap;position:relative}
.pm-tb-sw:hover{background:#F2F6FC}
.pm-tb-sw input{position:absolute;opacity:0;width:0;height:0}
.pm-tb-sw i{position:relative;width:30px;height:18px;border-radius:10px;background:#D6DEEA;transition:background .2s;flex:none}
.pm-tb-sw i:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s,background .2s}
.pm-tb-sw input:checked+i{background:var(--navy)}.pm-tb-sw input:checked+i:after{transform:translateX(12px);background:var(--yellow)}
.pm-tb-sw input:focus-visible+i{outline:2px solid var(--yellow);outline-offset:2px}
@media(max-width:760px){.pm-tb1{height:auto;flex-wrap:wrap;padding:8px 10px;gap:6px}.pm-tb-search{flex:1 1 100%}.pm-tb-sep{display:none}}

/* ===== Pusat Bantuan (panduan halaman) ===== */
.md.hp{max-width:1040px}
.md.hp>h3{padding:16px 22px 12px}
.md.hp .bd{padding:0 22px 16px}
.hp-goal{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;margin:0 0 14px;background:linear-gradient(112deg,#F1F6FD,#FFFFFF 70%);border:1px solid #D6E3F3;border-left:4px solid var(--yellow);border-radius:12px;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.hp-goal>i{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--navy);color:var(--yellow);font-style:normal;font-weight:800;font-size:15px}
.hp-goal b{display:block;font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.hp-who{margin:8px 0 0;font-size:12.5px;color:var(--ink-3)}
.hp-tabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;padding:5px;margin:0 0 14px;background:#F3F6FB;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.hp-tabs button{flex:1 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:var(--ink-3);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.hp-tabs button:hover:not(.on){background:#E8EFF9;color:var(--navy)}
.hp-tabs button.on{background:linear-gradient(135deg,#0B1F45,#17457F);color:#fff;box-shadow:0 4px 10px rgba(11,31,69,.2)}
.hp-tabs button b{font-family:var(--mono);font-size:10.5px;font-weight:700;background:var(--line-2);color:var(--ink-3);border-radius:10px;padding:1px 7px}
.hp-tabs button.on b{background:var(--yellow);color:var(--navy)}
.hp-p{display:none}.hp-p.on{display:block}
.hp-lead{margin:0 0 12px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.hp-go{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border:1px solid #C9D8EE;border-radius:8px;background:#fff;color:var(--navy-2);font:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;text-decoration:none}
.hp-go:hover{background:var(--navy);border-color:var(--navy);color:var(--yellow)}
/* alur */
.hp-flow{list-style:none;margin:0;padding:0;counter-reset:hp}
.hp-flow>li{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start;padding:0 0 16px}
.hp-flow>li:before{counter-increment:hp;content:counter(hp);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--yellow);font-weight:800;font-size:14px;position:relative;z-index:1}
.hp-flow>li:after{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.hp-flow>li:last-child{padding-bottom:0}.hp-flow>li:last-child:after{display:none}
.hp-flow b{display:block;font-size:14px;color:var(--navy);margin-bottom:2px}
.hp-flow span{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.hp-flow em{font-style:normal;display:inline-block;margin-top:5px;padding:2px 9px;border-radius:20px;background:#FFF4D2;color:#7A5A06;font-size:12px;font-weight:700}
/* kartu tab */
.hp-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.hp-card{display:flex;flex-direction:column;gap:6px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#fff}
.hp-card b{font-size:14px;color:var(--navy)}
.hp-card span{font-size:13px;color:var(--ink-2);line-height:1.55;flex:1}
.hp-card .hp-go{align-self:flex-start;margin-top:4px}
.hp-card.cur{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);background:#F5F9FF}
.hp-card.cur b:after{content:"Anda di sini";margin-left:8px;font-size:10.5px;font-weight:800;background:var(--yellow);color:var(--navy);padding:1px 8px;border-radius:20px;vertical-align:1px}
/* tombol */
.hp-tbl{width:100%;border:1px solid var(--line);border-radius:12px;border-collapse:separate;border-spacing:0;overflow:hidden}
.hp-tbl th{background:#F7F9FC;font-size:11.5px;padding:9px 12px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);border-bottom:1px solid var(--line)}
.hp-tbl td{padding:11px 12px;font-size:13.5px;line-height:1.55;vertical-align:top;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.hp-tbl tr:last-child td{border-bottom:0}
.hp-tbl td:first-child{width:30%}
.hp-key{display:inline-flex;align-items:center;min-height:28px;padding:3px 11px;border-radius:8px;border:1px solid #C9D8EE;background:#F5F9FF;color:var(--navy);font-weight:800;font-size:12.5px}
.hp-dest{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hp-dest small{font-size:12.5px;color:var(--ink-3)}
.hp-dest .pop{display:inline-block;padding:1px 9px;border-radius:20px;background:#E8F1FC;color:var(--navy-2);font-size:11.5px;font-weight:800}
.hp-dest .menu{display:inline-block;padding:1px 9px;border-radius:20px;background:#FFF4D2;color:#7A5A06;font-size:11.5px;font-weight:800}
/* contoh isian */
.hp-forms{display:flex;flex-direction:column;gap:10px}
.hp-form{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.hp-form>summary{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;font-weight:800;font-size:14px;color:var(--navy);list-style:none;background:#F7F9FC}
.hp-form>summary::-webkit-details-marker{display:none}
.hp-form>summary:before{content:"›";display:inline-block;transition:transform .2s;font-size:18px;line-height:1;color:var(--ink-3)}
.hp-form[open]>summary:before{transform:rotate(90deg)}
.hp-form>summary small{margin-left:auto;font-weight:700;color:var(--ink-3);font-size:12px}
.hp-ftbl{width:100%;border-collapse:collapse}
.hp-ftbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.hp-ftbl td{padding:10px 12px;font-size:13.5px;line-height:1.55;vertical-align:top;border-bottom:1px solid var(--line-2);color:var(--ink-2)}
.hp-ftbl tr:last-child td{border-bottom:0}
.hp-ftbl td:first-child{font-weight:800;color:var(--ink);width:24%}
.hp-ftbl td:last-child{width:34%}
.hp-req{display:inline-block;margin-left:5px;padding:0 7px;border-radius:20px;background:var(--bad-bg);color:var(--bad);font-size:10.5px;font-weight:800;vertical-align:1px}
.hp-opt{display:inline-block;margin-left:5px;padding:0 7px;border-radius:20px;background:var(--line-2);color:var(--ink-3);font-size:10.5px;font-weight:800;vertical-align:1px}
.hp-ex{display:inline-block;padding:3px 9px;border-radius:7px;background:#FFF7DB;border:1px solid #F6DB81;color:#4E4B3E;font-size:13px}
.hp-tips{margin:14px 0 0;padding:12px 16px;background:#F3FAF6;border:1px solid #CDE8DA;border-radius:12px;font-size:13.5px;line-height:1.6;color:#1E5A40}
.hp-tips b{display:block;margin-bottom:3px}
.hp-tips ul{margin:0;padding-left:18px}

function pmoAllWbs(){return S.wbs.filter(w=>!w.arsip&&(VIEW==='pmo-wbsplan'&&S.ui.planYear!=='year'||yrOf(w)===S.ui.tahun))}
function pmoScopedWbs(period=true){const P=per();return pmoAllWbs().filter(w=>(!S.ui.prog||w.prog===S.ui.prog)&&unitMatch(w,curUnit(),umOf())&&(!period||VIEW==='pmo-wbsplan'&&S.ui.planYear!=='year'||inP(w,P)))}
function pmoProgramList(ignoreProgram=false){const y=+S.ui.tahun,u=curUnit(),mode=umOf();return progVis().filter(p=>{
 if(!ignoreProgram&&S.ui.prog&&p.akr!==S.ui.prog)return false;
 const ys=String(p.periode||'').match(/20\d{2}/g)||[];
 const y0=+p.mulai||+(ys[0]||0),y1=+(ys[ys.length-1]||0)||y0;
 const inYear=(y0&&y>=y0&&y<=(y1||y0))||pmoAllWbs().some(w=>w.prog===p.akr);
 if(!inYear)return false;
 if(!u)return true;
 const a=unitsOf(p.uic).includes(u),b=unitsOf(p.pend).includes(u);
 if(mode==='u')return a;
 if(mode==='p')return b;
 if(mode==='ue')return pmoAllWbs().some(w=>w.prog===p.akr&&unitMatch(w,u,'ue'));
 return a||b||pmoAllWbs().some(w=>w.prog===p.akr&&unitMatch(w,u,'up'));
 })}
function pmoRiskList(){const P=per();return S.risks.filter(r=>{
 if(!riskVis(r))return false;
 const p=S.programs.find(x=>x.kode===r.prog||x.akr===r.prog)||modOf(r.item)&&progOf(modOf(r.item).prog)||progOf((r.item||'').split('-')[0]);
 if(S.ui.prog&&(!p||p.akr!==S.ui.prog))return false;
 if(curUnit()&&!(r.pemilik===curUnit()||p&&pmoProgramList().includes(p)||r.item&&wbsBy(r.item)&&unitMatch(wbsBy(r.item),curUnit(),umOf())))return false;
 if(r.tenggat&&+r.tenggat.slice(0,4)!==+S.ui.tahun)return false;
 if(r.tenggat&&P.pr!=='all'&&(r.tenggat<P.d1||r.tenggat>P.d2))return false;
 return true;
 })}
function pmoCrList(){const P=per();return S.crs.filter(c=>{
 if(!crVis(c))return false;
 const w=wbsBy(c.item);
 if(S.ui.prog&&(!w||w.prog!==S.ui.prog))return false;
 if(w){if(yrOf(w)!==S.ui.tahun)return false;if(!unitMatch(w,curUnit(),umOf()))return false}
 else if(curUnit()&&c.unit!==curUnit())return false;

/* --- Program & proyek (diturunkan dari WBS Lv 4) --- */
function progProjects(p){
 const it=pmoScopedWbs().filter(w=>w.prog===p.akr),g={};
 it.forEach(w=>{
   const coreModule=p.akr==='CORE'&&/pengembangan integrated core system apbn kemenkeu/i.test(w.p[2]||'')&&w.p[3];
   const name=coreModule?w.p[3]:(w.p[2]||w.p[1]||'(tanpa kelompok)');
   const sub=coreModule?(w.p[4]||w.p[5]||''):(w.p[3]||'');
   const ent=g[name]||(g[name]={a:[],subs:{}});
   ent.a.push(w);if(sub&&sub!==name)(ent.subs[sub]=ent.subs[sub]||[]).push(w);
 });
 return Object.entries(g).map(([n,v])=>{
  const a=v.a;let t=0,d=0;const u={};a.forEach(w=>{const b=+w.w||0;t+=b;if(doneAt(w,12)&&w.v)d+=b;const k=String(w.u||'').split(/[,(]/)[0].trim();if(k)u[k]=(u[k]||0)+1});
  const uic=Object.entries(u).sort((a,b)=>b[1]-a[1])[0];
  return {n,a,uic:uic?uic[0]:'—',pg:t?Math.round(d/t*100):0,late:a.filter(w=>stOf(w,12)==='Terlambat').length,sub:Object.keys(v.subs),subItems:Object.entries(v.subs).map(([name,rows])=>({name,count:rows.length})),s:a.reduce((m,w)=>!m||w.s<m?w.s:m,''),f:a.reduce((m,w)=>w.f>m?w.f:m,'')};
 });
}

/* Register tingkat proyek dan subproyek (salinan independen antar modul). */
const projectKey=(prog,project,sub='')=>[prog,project,sub].map(v=>encodeURIComponent(String(v||''))).join('|');
const projectLabels=k=>String(k||'').split('|').map(v=>{try{return decodeURIComponent(v)}catch(e){return v}});
function projectStores(){
 S.projectRisks=Array.isArray(S.projectRisks)?S.projectRisks:[];
 S.projectStakeholders=Array.isArray(S.projectStakeholders)?S.projectStakeholders:[];
 S.projectDecisions=Array.isArray(S.projectDecisions)?S.projectDecisions:[];
}
function projectWbs(k){const [prog,proj,sub]=projectLabels(k);return S.wbs.filter(w=>!w.arsip&&w.prog===prog&&yrOf(w)===S.ui.tahun&&
  (w.p.includes(proj)||((w.p[2]||'')===proj))&&(!sub||w.p.includes(sub)));}
function projectCmoModule(k){
 const a=projectWbs(k);const matching=mods().filter(m=>a.some(w=>m.items.includes(w)||m.adp===w||(m.sc.length>0&&m.sc.every((x,i)=>w.p[i]===x))));
 return matching.length===1?matching[0]:null;
}

function ensureNar(){const loc=!(typeof FB!=='undefined'&&FB.on);let ch=false;(S.programs||[]).forEach(p=>{const sd=NAR0[p.akr];if(!sd||p.narSeed)return;if(!loc&&!canW('lap','U',p.uic))return;p.nar=p.nar||{};if(!p.nar['2026']){p.nar['2026']=JSON.parse(JSON.stringify(sd));Object.values(p.nar['2026']).forEach(x=>{x.st='Final';x.by='Laporan Narasi T-Program 2026';x.at=''})}p.narSeed=1;ch=true});if(ch)setTimeout(save,0)}
const narGet=(p,y,tw)=>((p.nar||{})[y]||{})[tw]||null;

const exL=a=>`<ol class="exl">${(a||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
const exT=(h,rows)=>`<div class="tscroll"><table class="lap ext"><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const exF=(l,v)=>`<div class="exf"><span>${l}</span><div>${v}</div></div>`;

 asis:()=>exF('a. Uraian proses bisnis saat ini',esc(OAX.asis.pb))+exF('Permasalahan utama',esc(OAX.asis.masalah))+exF('b. Korelasi dengan sistem eksisting',exT(['Proses bisnis','Sistem eksisting','Pemilik','Dukungan','Celah'],OAX.asis.kor.map(r=>[r.p,r.s,r.o,r.dk,r.c])))+exF('c. Teknologi yang digunakan',esc(OAX.asis.tek)),

/* ===== Mesin Pusat Bantuan ===== */
let CURF=null;
const HP_OK=g=>{try{return !g||/^modul-/.test(g)||allowedViews().includes(g)}catch(e){return true}};
const hpGo=(g,l)=>g&&HP_OK(g)?`<button class="hp-go" data-hgo="${esc(g)}">${esc(l||'Buka')} ›</button>`:'';
function hpGuideOf(v){
 let g=GUIDE[v];
 if(!g&&/^modul-/.test(v)){const tb=v.split('-t-')[1]||'siklus';g=GUIDE['cmo-'+tb]}
 if(!g&&v==='pmo-charter')g=GUIDE['pmo-perencanaan'];
 if(g)return g;
 const h=helpOf(v);
 if(h)return{tujuan:h.d,alur:(h.c||[]).map(x=>['Langkah',x]),x:h.x,tips:[]};
 return{tujuan:'Halaman ini menampilkan data sesuai peran Anda.',alur:[['Gunakan filter','Persempit data dengan filter di bagian atas.'],['Tombol aksi','Tombol tambah/ubah hanya muncul bila peran Anda berhak.']]}
}
function hpAlur(g){
 if(!g.alur||!g.alur.length)return '';
 return `<ol class="hp-flow">${g.alur.map(a=>{const [j,i,go,lb,fid,wz]=a;
  const ex=fid&&FORMEX[fid]?`<em>Contoh isian tersedia</em>`:'';
  const wzb=wz?`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${wz.map(k=>EXTT[k]?`<button class="hp-go" data-act="chex" data-k="${k}">💡 ${esc(EXTT[k])}</button>`:'').join('')}</div>`:'';
  return `<li><div><b>${esc(j)}</b><span>${esc(i)}</span>${ex?`<button class="hp-go" style="margin-top:6px" data-hexf="${fid}">💡 Lihat contoh isian</button>`:''}${wzb}</div>${hpGo(go,lb)}</li>`}).join('')}</ol>`}
function hpTabs(g){
 if(!g.tab||!g.tab.length)return '';
 return `<div class="hp-cards">${g.tab.map(([n,i,go])=>`<div class="hp-card"><b>${esc(n)}</b><span>${esc(i)}</span>${hpGo(go,'Buka')}</div>`).join('')}</div>`}
function hpBtn(g){
 if(!g.btn||!g.btn.length)return '';
 return `<table class="hp-tbl"><thead><tr><th>Tombol / menu</th><th>Fungsinya</th><th>Menuju</th></tr></thead><tbody>${g.btn.map(([t,f,m,go])=>`<tr><td><span class="hp-key">${esc(t)}</span></td><td>${esc(f)}</td><td><div class="hp-dest"><span class="${go?'menu':'pop'}">${esc(m)}</span>${hpGo(go,'Buka')}</div></td></tr>`).join('')}</tbody></table>`}
function hpFormsHtml(ids,open){
 return `<div class="hp-forms">${ids.map(id=>{const fx=FORMEX[id];if(!fx)return '';
  return `<details class="hp-form" id="hpf-${id}"${(open===id||ids.length<=2)?' open':''}><summary>${esc(fx.title)}<small>${fx.f.length} isian</small></summary><table class="hp-ftbl"><thead><tr><th>Isian</th><th>Cara mengisi</th><th>Contoh</th></tr></thead><tbody>${fx.f.map(([k,l,r,c,e])=>`<tr><td>${esc(l)}${r?'<span class="hp-req">wajib</span>':'<span class="hp-opt">opsional</span>'}</td><td>${esc(c)}</td><td>${e?`<span class="hp-ex">${esc(e)}</span>`:'—'}</td></tr>`).join('')}</tbody></table></details>`}).join('')}</div>`}
function hpIsiIds(g){
 const s=[];(g.isi||[]).forEach(x=>{if(FORMEX[x]&&!s.includes(x))s.push(x)});
 (g.alur||[]).forEach(a=>{if(a[4]&&FORMEX[a[4]]&&!s.includes(a[4]))s.push(a[4])});return s}
function showHelp(v,title){
 const g=hpGuideOf(v);const ids=hpIsiIds(g);
 const wiz=(g.x&&g.x.length)?`<div class="hp-tips" style="background:#F5F9FF;border-color:#D6E3F3;color:var(--ink-2)"><b>Contoh pengisian lengkap (wizard)</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${g.x.map(k=>EXTT[k]?`<button class="hp-go" data-act="chex" data-k="${k}">💡 ${esc(EXTT[k])}</button>`:'').join('')}</div></div>`:'';
 const panels=[
  ['ring','Ringkasan',`<div class="hp-goal"><i>?</i><div><b>Tujuan halaman</b>${esc(g.tujuan)}${g.siapa?`<div class="hp-who">Siapa: ${esc(g.siapa)}</div>`:''}</div></div>${g.tips&&g.tips.length?`<div class="hp-tips"><b>Tips</b><ul>${g.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div>`:''}`,0],
  ['alur','Alur',hpAlur(g),(g.alur||[]).length],
  ['tab','Tab & Fitur',hpTabs(g),(g.tab||[]).length],
  ['btn','Tombol & Pindah Menu',hpBtn(g),(g.btn||[]).length],
  ['isi','Contoh Isian',(ids.length?hpFormsHtml(ids):'')+wiz,ids.length+((g.x&&g.x.length)?g.x.length:0)]
 ].filter(p=>p[0]==='ring'||p[2]);
 const body=`<div class="hp-tabs" role="tablist">${panels.map((p,i)=>`<button role="tab" data-hp="${p[0]}" class="${i?'':'on'}">${p[1]}${p[3]?`<b>${p[3]}</b>`:''}</button>`).join('')}</div>${panels.map((p,i)=>`<div class="hp-p${i?'':' on'}" data-hpp="${p[0]}">${p[2]}</div>`).join('')}`;
 const ov=modal(`<span class="exh"><span class="hlp sm" aria-hidden="true">?</span>Panduan · ${esc(title||'')}</span>`,body,'',null,{size:'wide hp',cancel:'Tutup',extra:`<button class="btn hp-btn-ex" data-mx="home">📖 Pusat Bantuan (semua menu)</button>`,onExtra:k=>{if(k==='home'){setTimeout(showGuideHome,0)}}});
 hpWire(ov);return ov}
function hpSwitch(ov,key){ov.querySelectorAll('.hp-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.hp===key));ov.querySelectorAll('.hp-p').forEach(p=>p.classList.toggle('on',p.dataset.hpp===key))}
function hpWire(ov){
 ov.addEventListener('click',e=>{
  const t=e.target.closest('[data-hp]');if(t){hpSwitch(ov,t.dataset.hp);return}
  const g=e.target.closest('[data-hgo]');if(g){const h=g.dataset.hgo;ov.remove();go(h);return}
  const f=e.target.closest('[data-hexf]');if(f){hpSwitch(ov,'isi');const d=ov.querySelector('#hpf-'+f.dataset.hexf);if(d){d.open=true;d.scrollIntoView({block:'nearest',behavior:'smooth'})}return}
 })}
/* Pusat Bantuan global */
function showGuideHome(){
 const cur=typeof VIEW!=='undefined'?VIEW:'';
 const flow=(arr)=>`<ol class="hp-flow">${arr.map(([j,i,g,l])=>`<li><div><b>${esc(j)}</b><span>${esc(i)}</span></div>${hpGo(g,l)}</li>`).join('')}</ol>`;
 const menus=[];
 PMG.forEach(([k,n,,tabs])=>tabs.forEach(t=>{const p=PMT.find(x=>x[0]===t);if(p)menus.push(['pmo-'+p[0],'PMO · '+p[1]])}));
 CMT.forEach(c=>menus.push(['cmo-'+c[0],'CMO · '+c[1]]));
 STN.forEach(s=>menus.push([s[0],'Pengaturan · '+s[1]]));
 menus.unshift(['dashboard','Dashboard Eksekutif']);menus.unshift(['beranda','Beranda']);
 const visible=menus.filter(m=>HP_OK(m[0]));
 const peta=`<div class="hp-cards">${visible.map(([v,n])=>{const g=GUIDE[v]||{};return `<div class="hp-card${v===cur?' cur':''}"><b>${esc(n)}</b><span>${esc(g.tujuan||'')}</span><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="hp-go" data-hgo="${esc(v)}">Buka ›</button><button class="hp-go" data-hhelp="${esc(v)}" data-t="${esc(n)}">Panduan ›</button></div></div>`}).join('')}</div>`;
 const gl=`<table class="hp-tbl"><tbody>${GLOSS.map(([a,b])=>`<tr><td><span class="hp-key">${esc(a)}</span></td><td>${esc(b)}</td></tr>`).join('')}</tbody></table>`;
 const rl=`<table class="hp-tbl" style="margin-top:12px"><thead><tr><th>Peran</th><th>Tugas utama</th></tr></thead><tbody>${GROLES.map(([a,b])=>`<tr><td><span class="hp-key">${esc(a)}</span></td><td>${esc(b)}</td></tr>`).join('')}</tbody></table>`;
 const panels=[
  ['alur','Alur PMO',`<p class="hp-lead">Dari program sampai penutupan. Klik <b>Buka</b> untuk langsung pindah ke menu terkait.</p>${flow(FLOW_PMO)}`],
  ['cmo','Alur CMO',`<p class="hp-lead">Change Management mengikuti lima tahap per modul.</p>${flow(FLOW_CMO)}`],
  ['peta','Peta Menu',`<p class="hp-lead">Semua menu yang boleh Anda buka. Tombol <b>Panduan</b> menampilkan penjelasan lengkap halaman itu.</p>${peta}`],
  ['gl','Istilah & Peran',`${gl}${rl}`]
 ];
 const body=`<div class="hp-goal"><i>?</i><div><b>Pusat Bantuan</b>Ikuti alur di bawah, atau buka Peta Menu untuk melihat fungsi tiap halaman. Di setiap halaman ada tombol <strong>?</strong> di judul untuk panduan khusus halaman tersebut, dan tombol <strong>💡 Contoh pengisian</strong> di setiap formulir.</div></div><div class="hp-tabs" role="tablist">${panels.map((p,i)=>`<button role="tab" data-hp="${p[0]}" class="${i?'':'on'}">${p[1]}</button>`).join('')}</div>${panels.map((p,i)=>`<div class="hp-p${i?'':' on'}" data-hpp="${p[0]}">${p[2]}</div>`).join('')}`;
 const ov=modal('<span class="exh"><span class="hlp sm" aria-hidden="true">?</span>Pusat Bantuan Modul Transformasi</span>',body,'',null,{size:'wide hp',cancel:'Tutup'});
 hpWire(ov);
 ov.addEventListener('click',e=>{const h=e.target.closest('[data-hhelp]');if(h){ov.remove();showHelp(h.dataset.hhelp,h.dataset.t)}});
 return ov}

function showFormEx(id){

ACT.help=el=>showHelp(el.dataset.v,el.dataset.t);

// Isi konfigurasi di sini sebelum di-hosting agar semua pengguna langsung tersambung, contoh:
// const FIREBASE_CONFIG={apiKey:'…',authDomain:'proyek.firebaseapp.com',projectId:'proyek',storageBucket:'proyek.appspot.com',messagingSenderId:'…',appId:'…'};
const FIREBASE_CONFIG=null;
const RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    function signedIn() { return request.auth != null && request.auth.token.email.matches('.*@kemenkeu[.]go[.]id$'); }\n    function myRef() { return /databases/$(db)/documents/users/$(request.auth.token.email); }\n    function me() { return get(myRef()).data; }\n    function aktif() { return signedIn() && exists(myRef()) && me().aktif == true; }\n    function role(rs) { return aktif() && me().role in rs; }\n    function kosong() { return !exists(/databases/$(db)/documents/config/akses); }\n\n    // Pengguna: dibaca semua akun aktif; dikelola Superadmin.\n    // Pengecualian: saat database masih kosong, akun pertama boleh mendaftarkan dirinya sebagai Superadmin.\n    match /users/{email} {\n      allow read: if signedIn();\n      allow create: if role(['SA']) || (signedIn() && kosong() && email == request.auth.token.email && request.resource.data.role == 'SA');\n      allow update, delete: if role(['SA']);\n    }\n    match /config/{id} {\n      allow read: if signedIn();\n      allow write: if role(['SA']);\n    }\n    // Data PMO\n    match /{col}/{id} {\n      allow read: if aktif() && col in ['programs','charters','tahap','oneonone','projectRisks','projectStakeholders','projectDecisions','wbs','bukti','ms','kwide','kwideLinks','risks','crs','usul','sub','ind','sh','impl','jj','jjMod','pantau','adopsi','tr','reviu','modMeta','log'];\n      allow write: if col in ['programs','charters','tahap','oneonone','projectRisks','projectStakeholders','projectDecisions','wbs','bukti','ms','kwide','kwideLinks','risks','crs'] && role(['SA','PMOK','CMOK','PMOU']);\n      allow write: if col == 'sh' && role(['SA','PMOK','CMOK','PMOU','CMOU','TIM']);\n      allow write: if col == 'usul' && role(['SA','PMOK','CMOK','PMOU','CMOU']);\n      allow write: if col in ['sub','ind','impl','jj','jjMod','pantau','adopsi','tr','reviu','modMeta'] && role(['SA','PMOK','CMOK','CMOU','TIM']);\n      allow create: if col == 'log' && aktif();\n      allow update, delete: if col == 'log' && role(['SA']);\n    }\n  }\n}\n";
const FS_ARR=['users','programs','charters','tahap','oneonone','projectRisks','projectStakeholders','projectDecisions','wbs','kwide','risks','crs','usul','sub','ind','sh','jj','pantau','adopsi','tr','reviu','log'];

 for(const c in cur){const prev=FB.last[c]||{};next[c]={};for(const id in cur[c]){const js=stab(cur[c][id]);next[c][id]=js;if(prev[id]!==js)ops.push(['set',c,id,JSON.parse(js)])}if(c!=='log')for(const id in prev)if(!(id in next[c]))ops.push(['del',c,id])}
 if(!ops.length){FB.st='Tersimpan';setDbBadge();if(FB.done){toast(FB.done);FB.done='';busyOff()}return}
 try{for(let i=0;i<ops.length;i+=400){if(FB.done)busy('Menyimpan ke Firestore…',`${Math.min(i+400,ops.length).toLocaleString('id-ID')} dari ${ops.length.toLocaleString('id-ID')} perubahan · jangan tutup halaman`,80+i/ops.length*20);const b=FB.db.batch();ops.slice(i,i+400).forEach(([k,c,id,d])=>{const r=FB.db.collection(c).doc(id);k==='set'?b.set(r,d):b.delete(r)});await b.commit()}
  for(const c in next){FB.last[c]=Object.assign({},c==='log'?FB.last[c]:{},next[c])}FB.st='Tersimpan ke Firestore';FB.err='';if(FB.done){const m=FB.done;FB.done='';busyOff();toast(m+' Tersimpan ke Firestore.')}}

 else if(FS_MAP.includes(c)){const tgt=S[c];Object.entries(docs).forEach(([k,d])=>{if(stab(d)===FB.last[c][k])return;changed=true;if(tgt[k]){Object.keys(tgt[k]).forEach(x=>delete tgt[k][x]);Object.assign(tgt[k],d)}else tgt[k]=d});Object.keys(tgt).forEach(k=>{if(!(k in docs)){delete tgt[k];changed=true}})}

const pptxt=n=>Array.from(n.getElementsByTagName('a:p')).map(p=>Array.from(p.getElementsByTagName('a:t')).map(t=>t.textContent||'').join('').trim()).filter(Boolean);
const pptxn=x=>String(x||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
const pptxa=x=>(x||[]).map(pptxn).filter(Boolean);
const pptxb=x=>pptxa(x).filter(t=>!/^(\d{4}|tahun\s+\d{4})$/i.test(t));
function pptxsh(xml){
 return Array.from(xml.getElementsByTagName('p:sp')).map(n=>{
  const body=n.getElementsByTagName('p:txBody')[0];if(!body)return null;
  const a=pptxt(body);if(!a.length)return null;
  const props=n.getElementsByTagName('p:spPr')[0],trans=props&&props.getElementsByTagName('a:xfrm')[0];
  const off=trans&&trans.getElementsByTagName('a:off')[0];
  return {a,t:pptxn(a.join(' ')),x:off?+off.getAttribute('x')/914400:0,y:off?+off.getAttribute('y')/914400:0};
 }).filter(Boolean);
}
function pptxtabs(xml){
 return Array.from(xml.getElementsByTagName('a:tbl')).map(t=>
  Array.from(t.getElementsByTagName('a:tr')).map(r=>
   Array.from(r.children).filter(c=>c.localName==='tc').map(c=>pptxt(c))));
}

};
function pptxcore(sl){

 const d={judul:sl.title,tujuan:'',lb:[],tb:'',out:[],oc:[],periode:'',ris:[],pk:[],mil:[],owners:'',champion:'Menteri Keuangan'};

  d.tujuan=pptxn(cell(0,1).join(' '));d.lb=pptxb(cell(2,0));d.tb=cell(2,1).join('\n');

   for(let i=0;i<tbl.length;i++)if(pptxn(cell(i,col).join(' ')).toLowerCase()===label.toLowerCase())
    for(let j=i+1;j<tbl.length;j++)if(cell(j,col).length)return cell(j,col);
   return [];
  };

 }else{

  const at=(minx,maxx,miny,maxy)=>sections.filter(x=>x.x>=minx&&x.x<maxx&&x.y>=miny&&x.y<maxy).sort((a,b)=>a.y-b.y)[0];
  const get=(x1,x2,y1,y2)=>{const q=at(x1,x2,y1,y2);return q?q.a:[]};
  d.tujuan=pptxn(get(1.7,7.4,1.3,2.2).join(' '));

  d.out=pptxb(get(7.05,10.5,2.3,4.15));d.oc=pptxb(get(10.5,14.5,2.3,4.4));
  d.periode=get(3.3,7.15,4.28,5.12).join(' ');
  d.ris=pptxb(get(7.05,10.5,4.28,5.12));
  d.pk=pptxb(get(0,3.3,5.0,7.4));
  d.mil=get(3.3,7.15,5.12,7.2);
  d.owners=get(7.05,10.5,5.12,7.4).join('\n');
 }
 const years=String(d.periode).match(/20\d{2}/g)||[];
 d.p1=years.length?+years[0]:S.ui.tahun;d.p2=years.length?+years[years.length-1]:S.ui.tahun;
 let y=d.p1;d.ms=[];

 });

 if(m)d.champion=pptxn(m[1]);

 return d;
}
function pptxpairs(sl){

async function pptxcharters(file){
 if(!/\.pptx$/i.test(file.name))throw Error('Berkas harus berformat .pptx');
 if(file.size>20e6)throw Error('PPTX terlalu besar (maksimal 20 MB).');

  catch(e){await chLib('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',()=>!!window.JSZip)}
 }
 const zip=await JSZip.loadAsync(file);
 const names=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n))
  .sort((a,b)=>+a.match(/slide(\d+)/)[1]-+b.match(/slide(\d+)/)[1]);
 const slides=[];
 for(const name of names){
  const xml=new DOMParser().parseFromString(await zip.file(name).async('string'),'text/xml');
  const shapes=pptxsh(xml),tables=pptxtabs(xml);
  const h=shapes.find(x=>/^(?:Charter\s+)?Program Transformasi\s*:/i.test(x.t));
  const title=h?pptxn(h.t.replace(/^(?:Charter\s+)?Program Transformasi\s*:\s*/i,'')):'';
  slides.push({shapes,tables,title,index:slides.length+1});
 }
 const all=[];
 slides.forEach((sl,i)=>{
  if(!sl.title||/^(?:…|\.{2,}|xxx)/i.test(sl.title))return;
  const d=pptxcore(sl);if(!d.tujuan&&!d.lb.length&&!d.out.length)return;
  d.kp=pptxpairs(slides[i+1]).map(x=>({m:x.a,k:[x.b]}));
  d.cs=pptxpairs(slides[i+3]).map(x=>({a:x.a,b:x.b}));
  d.prog=pptxid(sl.title);d.slide=sl.index;
  all.push(d);
 });
 return all;
}
function previewCharterImport(items,file){
 const perms=S.programs.filter(p=>chCan('C',p)||chCan('U',p));
 let body='<div class="note i"><span><b>'+items.length+' charter ditemukan</b> dalam '+esc(file.name)+'. Periksa program tujuan. Impor membuat versi Draft baru; dokumen yang sudah disahkan tetap utuh. Jadwal berbentuk grafik Gantt tidak otomatis diimpor.</span></div>';
 body+=items.map((d,i)=>'<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">'+
 '<div><b>'+esc(d.judul)+'</b><div class="sm">Slide '+d.slide+' · '+d.lb.length+' latar belakang · '+d.out.length+' output · '+d.kp.length+' kriteria penyelesaian · '+d.cs.length+' perbandingan</div></div>'+
 '<select class="sel" style="max-width:330px" data-charter-map="'+i+'"><option value="">Lewati / tidak cocok</option>'+
 perms.map(p=>'<option value="'+esc(p.akr)+'"'+(p.akr===d.prog?' selected':'')+'>'+esc(p.kode+' · '+p.nama)+'</option>').join('')+
 '</select></div><p class="s" style="margin:7px 0 0"><b>Tujuan:</b> '+esc(d.tujuan||'Belum terbaca')+'</p></div>').join('');
 const box=modal('Pratinjau Import Charter dari PPTX',body,'Simpan Draft',()=>{
  const targets=new Set(),sel=[];
  for(let i=0;i<items.length;i++){
   const akr=box.querySelector('[data-charter-map="'+i+'"]').value;
   if(!akr)continue;
   if(targets.has(akr)){toast('Ada dua charter dipetakan ke program yang sama.');return false}
   const p=S.programs.find(x=>x.akr===akr);
   if(!p||!chCan('C',p)&&!chCan('U',p)){toast('Tidak ada izin mengimpor ke program '+akr);return false}
   if(!items[i].tujuan){toast('Tujuan program belum terbaca untuk '+items[i].judul);return false}
   targets.add(akr);sel.push({d:items[i],akr,p});
  }
  if(!sel.length){toast('Pilih minimal satu program tujuan.');return false}
  sel.forEach(({d,akr,p})=>{
   const prior=chList(akr),ver=Math.max(0,...prior.map(x=>+x.ver||0))+1;
   S.charters.push({id:uid(),prog:akr,tahun:S.ui.tahun,ver,st:'Draft',
    judul:d.judul,tujuan:d.tujuan,lb:d.lb,tb:d.tb,out:d.out,oc:d.oc,
    p1:d.p1,p2:d.p2,ms:d.ms,ris:d.ris,pk:d.pk,ch:d.champion,ow:d.ow.length?d.ow:[p.sponsor||''],
    kpY:d.p1,kp:d.kp,cs:d.cs,rk:[],mf:[],
    asis:{pb:'',masalah:'',link:'',kor:[],tek:''},tobe:{pb:[],pot:[],ar:'',link:'',arLink:''},
    log:[{st:'Draft',by:chBy(),at:TODAY}],doc:{link:''},keRisk:true,
    sumberPptx:file.name,slidePptx:d.slide});
  });
  log('Import Charter PPTX',file.name+': '+sel.length+' program');
  if(FB.on&&FB.ready){FB.done=sel.length+' charter Draft berhasil diimpor.';busy('Menyimpan charter ke Firestore…',sel.length+' dokumen · jangan tutup halaman sampai selesai',80);save();render()}else{save();render();toast(sel.length+' charter Draft dibuat pada penyimpanan lokal. Sambungkan Firestore agar bisa diakses dari browser lain.')}
 },{size:'wide'});
}
document.addEventListener('change',async e=>{
 const input=e.target;if(input.dataset.on!=='impcharter')return;

},true);
