name: Repair Dashboard CM embedded module
on:
  push:
    paths:
      - '.github/workflows/repair-cm-embedded.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Move embedded navigation code outside report template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("dashboard-cm-shared.html")
          s=p.read_text(encoding="utf-8")
          marker="<!-- Modul Transformasi: same-source Dashboard CM embedding (no data copies). -->"
          start=s.find(marker)
          end=s.find("</body></html>`;",start)
          if start<0 or end<start:
              raise SystemExit("Expected malformed insertion not found; no changes applied")
          block=s[start:end].strip()
          cleaned=s[:start]+s[end:]
          pos=cleaned.rfind("</body>")
          if pos<0: raise SystemExit("Missing document closing body")
          fixed=cleaned[:pos]+"\n"+block+"\n"+cleaned[pos:]
          assert fixed.count(marker)==1
          p.write_text(fixed,encoding="utf-8")
          print("Fixed misplaced script and preserved original Dashboard CM")
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-cm-shared.html
          git diff --cached --quiet || (git commit -m "Fix embedded CRA rendering script placement" && git push)
