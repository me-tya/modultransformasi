name: Full prechange backup 261117-MT-03
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mt-backup-261117-03.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create complete restorable 261117-MT-03.zip
        run: |
          git fetch origin refs/heads/backup/261117-MT-03:refs/remotes/origin/backup/261117-MT-03
          git archive --format=zip --output=261117-MT-03.zip origin/backup/261117-MT-03
          unzip -t 261117-MT-03.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: 261117-MT-03
          path: 261117-MT-03.zip
          retention-days: 90
