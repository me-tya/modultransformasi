name: Full prechange backup 261126-MT-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mt-backup-261126-mt-16.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cdbe41714b12f68de0bfd3c9dbd1ad963d1fcb62
          fetch-depth: 0
      - name: Create and verify complete snapshot
        run: |
          test "$(git rev-parse HEAD)" = "cdbe41714b12f68de0bfd3c9dbd1ad963d1fcb62"
          git archive --format=zip --output=261126-MT-16.zip HEAD
          unzip -t 261126-MT-16.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: 261126-MT-16
          path: 261126-MT-16.zip
          retention-days: 90
