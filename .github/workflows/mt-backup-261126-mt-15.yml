name: Full prechange backup 261126-MT-15
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mt-backup-261126-mt-15.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a487c4d53ca47e53a106a098bca92b9f91d67109
          fetch-depth: 0
      - name: Create and verify complete snapshot
        run: |
          test "$(git rev-parse HEAD)" = "a487c4d53ca47e53a106a098bca92b9f91d67109"
          git archive --format=zip --output=261126-MT-15.zip HEAD
          unzip -t 261126-MT-15.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: 261126-MT-15
          path: 261126-MT-15.zip
          retention-days: 90
