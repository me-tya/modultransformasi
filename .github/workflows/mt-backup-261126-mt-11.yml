name: Full prechange backup 261126-MT-11
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mt-backup-261126-mt-11.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d07123e23954bd3ba0226c55d2f7cabfdae6f957
          fetch-depth: 0
      - name: Create and verify complete snapshot
        run: |
          test "$(git rev-parse HEAD)" = "d07123e23954bd3ba0226c55d2f7cabfdae6f957"
          git archive --format=zip --output=261126-MT-11.zip HEAD
          unzip -t 261126-MT-11.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: 261126-MT-11
          path: 261126-MT-11.zip
          retention-days: 90
