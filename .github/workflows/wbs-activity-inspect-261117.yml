name: Inspect activity integration points for WBS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wbs-activity-inspect-261117.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Target source ranges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf8').splitlines()
          for rng in '5687:5702,5760:5823,5908:5930,6258:6269'.split(','):
            a,b=map(int,rng.split(':'))
            print('\n###',a,b)
            for k in range(a,b+1):
              if k<=len(lines):print(str(k)+': '+lines[k-1][:1800])
          PY
