name: Inspect activity integration points for WBS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wbs-activity-inspect-261117.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read MT wizard anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('index.html').read_text(encoding='utf8').splitlines()
          for a,b in [(5687,5706),(5740,5780),(5800,5820),(5830,5842),(5906,5928),(6200,6208),(6258,6275)]:
            print('###',a,b)
            for k in range(a,b+1):print(str(k)+': '+lines[k-1][:1300])
          PY
