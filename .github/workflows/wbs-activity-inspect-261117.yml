name: Inspect activity integration points for WBS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wbs-activity-inspect-261117.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ACT initialization order and WBS exporter scope
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('index.html').read_text(encoding='utf8')
          for pat in [r'(?m)\b(?:const|let|var)\s+ACT\s*=',r'window\.ACT\s*=',r'\bACT\s*=\s*\{',r'ACT\.actWbsIku\s*=',r'function pAktDaftar\(',r'\bconst\s+ACT\s*:',r'\bACT\.oneAdd\s*=']:
            ms=list(re.finditer(pat,s));print('PATTERN',pat,'COUNT',len(ms))
            for m in ms[:7]:print('LINE',s.count('\n',0,m.start())+1,repr(s[m.start()-80:m.start()+150].replace('\n',' ')))
          PY
