name: Inspect activity integration points for WBS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wbs-activity-inspect-261117.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact HTML head and WBS loaders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf8')
          for term in ['<head>','</head>','<body','</body>','activity-wbs.js','activity-wbs.css','activity-wbs-mt.js','function pAktDaftar','WBS']:
            ms=list(re.finditer(re.escape(term),s,re.I))
            print('TERM',term,'TOTAL',len(ms))
            for m in ms[:9]:
              i=m.start()
              print('LINE',s.count('\n',0,i)+1,'CONTEXT',repr(s[max(0,i-90):i+120].replace('\n',' ')))
          print('TOP',repr(s[:1200]))
          PY
