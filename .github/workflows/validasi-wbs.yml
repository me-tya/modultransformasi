name: Validasi rumus capaian WBS
on:
  push:
    paths:
      - 'index.html'
      - 'ui-tabs-unified.css'
      - 'project-selection-flow.js'
      - 'project-selection-workflow-2027.js'
      - 'project-selection-scope-map.js'
      - 'project-selection-documents.js'
      - 'project-selection-program-bank.js'
      - 'project-selection-program-bank.css'
      - 'planning-tabs-v2.js'
      - 'charter-planning-report.js'
      - 'charter-planning-report.css'
      - 'tests/project-selection-workflow.test.cjs'
      - 'tests/project-selection-bank.test.cjs'
      - 'project-selection-flow.css'
      - 'project-selection-ui.js'
      - 'dashboard-cm-shared.html'
      - 'tests/project-selection.test.cjs'
      - 'tests/ui-consistency.test.cjs'
      - 'tests/wbs-capaian-formula.test.cjs'
      - 'tests/header-charts-charter-history.test.cjs'
      - 'tests/cheatsheet-referensi.test.cjs'
      - 'cheatsheet-referensi.js'
      - 'ux-help-cheatsheet.js'
      - 'wbs-cap-2026-reference.js'
      - '.github/workflows/validasi-wbs.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'ui-tabs-unified.css'
      - 'project-selection-flow.js'
      - 'project-selection-workflow-2027.js'
      - 'project-selection-scope-map.js'
      - 'project-selection-documents.js'
      - 'project-selection-program-bank.js'
      - 'project-selection-program-bank.css'
      - 'planning-tabs-v2.js'
      - 'charter-planning-report.js'
      - 'charter-planning-report.css'
      - 'tests/project-selection-workflow.test.cjs'
      - 'tests/project-selection-bank.test.cjs'
      - 'project-selection-flow.css'
      - 'project-selection-ui.js'
      - 'dashboard-cm-shared.html'
      - 'tests/project-selection.test.cjs'
      - 'tests/ui-consistency.test.cjs'
      - 'tests/wbs-capaian-formula.test.cjs'
      - 'tests/header-charts-charter-history.test.cjs'
      - 'tests/cheatsheet-referensi.test.cjs'
      - 'cheatsheet-referensi.js'
      - 'ux-help-cheatsheet.js'
      - 'wbs-cap-2026-reference.js'
      - '.github/workflows/validasi-wbs.yml'
permissions:
  contents: read
jobs:
  cek-rumus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Uji logika capaian terhadap perubahan WBS
        run: node --test tests/*.test.cjs
