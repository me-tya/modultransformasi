name: Deploy WBS classification Modul Transformasi
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wbs-activity-release-261117.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch activity and validate code
        run: |
          set -eu
          python3 scripts/apply-wbs-activity-261117.py
          node --check activity-wbs.js
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf8')
          for x in ['activity-wbs.js?v=261117','ActivityWBS.wire(ov)','ActivityWBS.valid','ActivityWBS.matches','data-act="actWbsIku"','ACT.actWbsIku=']:
              assert x in s,x
          print('MT WBS integration assertions OK')
          PY
      - name: Commit and push without overwriting concurrent changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat(mt): classify PM CM WBS and export filtered IKU evidence"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
