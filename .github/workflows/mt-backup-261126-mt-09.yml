name: Full prechange backup 261126-MT-09
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mt-backup-261126-mt-09.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 879ab23587c8ebe9159045fdb02fce7c52deeba5
          fetch-depth: 0
      - name: Create and verify complete snapshot
        run: |
          test "$(git rev-parse HEAD)" = "879ab23587c8ebe9159045fdb02fce7c52deeba5"
          git archive --format=zip --output=261126-MT-09.zip HEAD
          unzip -t 261126-MT-09.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: 261126-MT-09
          path: 261126-MT-09.zip
          retention-days: 90
