name: Full prechange backup 261119-MT-04
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mt-backup-261119-mt-04.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create complete restorable 261119-MT-04.zip
        run: |
          git fetch origin refs/heads/backup/261119-MT-04:refs/remotes/origin/backup/261119-MT-04
          git archive --format=zip --output=261119-MT-04.zip origin/backup/261119-MT-04
          unzip -t 261119-MT-04.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: 261119-MT-04
          path: 261119-MT-04.zip
          retention-days: 90
