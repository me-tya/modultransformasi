name: Buat ZIP Cadangan 261110-MT-11
on:
  push:
    branches:
      - backup/261110-MT-11
    paths:
      - .github/workflows/backup-261110-MT-11.yml
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lengkap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Buat ZIP dari commit sebelum pembaruan
        run: |
          git archive --format=zip --output=261110-MT-11.zip e467c50325887de39fa23605933b08f1f11b2250
          unzip -t 261110-MT-11.zip | tail -1
      - name: Simpan ZIP pada branch backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 261110-MT-11.zip
          git commit -m "backup: full archive 261110-MT-11" || exit 0
          git push origin HEAD:backup/261110-MT-11
